/* ================= ROUTER : 네이티브 앱 방식 화면 스택 =================
   - S.stack: 방문 기록 [{screen, spot, scroll}]  (scroll = 화면 안 스크롤 영역들의 위치)
   - go(): 다음 화면으로 푸시(오른쪽에서 슬라이드)   back(): 직전 화면으로 팝(스크롤·선택 복원)
   - 하단 탭바만 '탭 전환'(스택 초기화), 화면 안 링크는 모두 푸시
   - 브라우저/안드로이드 뒤로가기, 아이폰 사파리 스와이프도 같은 back()으로 연결 */
const TOP=['home','explore','community','archive'];
const NAV={busy:false,ignorePop:0,sentinel:false,tabScroll:{},animT:0};
const SCROLL_SEL='.body,.hscroll,.chips';
const curScreen=()=>document.querySelector('#app > .screen:not(.leaving):not(.under)');
function snapScroll(root){root=root||curScreen();return root?[...root.querySelectorAll(SCROLL_SEL)].map(e=>[e.scrollTop,e.scrollLeft]):null}
function applyScroll(root,sc){if(!root||!sc)return;[...root.querySelectorAll(SCROLL_SEL)].forEach((e,i)=>{if(sc[i]){e.scrollTop=sc[i][0];e.scrollLeft=sc[i][1]}})}
const entry=()=>({screen:S.screen,spot:S.spot,scroll:snapScroll()});
function go(name,{spot=null,replace:rp=false}={}){
 clearTimers();finishAnim();
 if(name==='arrive'&&S.screen!=='arrive'){S.locked=false;S.jjkMode='overlay';S.jjkSlider=true}
 const ns=spot||S.spot;
 if(!rp&&name===S.screen&&ns===S.spot){render();return}   // 같은 화면 재진입은 제자리 갱신
 if(!rp)S.stack.push(entry());
 S.screen=name;S.spot=ns;render('push');syncHist();
}
function replace(name){go(name,{replace:true})}
function back(){if(!S.stack.length)return;doBack('pop');syncHist()}
function doBack(mode){clearTimers();finishAnim();const e=S.stack.pop();S.screen=e.screen;S.spot=e.spot;render(mode,e.scroll)}
function tabTo(name){
 clearTimers();finishAnim();
 if(!S.stack.length&&S.screen===name){const b=curScreen()?.querySelector('.body');if(b)b.scrollTo({top:0,behavior:'smooth'});return}
 const root=S.stack.length?S.stack[0]:entry();                 // 지금 탭의 첫 화면 스크롤 기억
 if(TOP.includes(root.screen))NAV.tabScroll[root.screen]=root.scroll;
 S.stack=[];S.screen=name;render('none',NAV.tabScroll[name]);syncHist();
}
/* 브라우저 기록 연동: 스택이 있을 때만 '센티널' 기록 1개를 두어 하드웨어/브라우저 뒤로가기를 앱 안에서 처리 */
function syncHist(){
 try{
  if(S.stack.length&&!NAV.sentinel){history.pushState({dm:1},'','#'+S.screen);NAV.sentinel=true}
  else if(!S.stack.length&&NAV.sentinel){NAV.sentinel=false;NAV.ignorePop++;history.back()}
  else history.replaceState(history.state,'','#'+S.screen);
 }catch(e){}
 const ed=document.getElementById('edge');if(ed)ed.classList.toggle('on',S.stack.length>0);
}
window.addEventListener('popstate',()=>{
 if(NAV.ignorePop>0){NAV.ignorePop--;try{history.replaceState(history.state,'','#'+S.screen)}catch(e){}return}
 NAV.sentinel=false;
 if(document.getElementById('sheet').classList.contains('on')){closeSheet();syncHist();return}
 if(S.stack.length){doBack(SWIPE.active?'none':'pop')}
 syncHist();
});
function finishAnim(){
 clearTimeout(NAV.animT);const app=document.getElementById('app');
 app.querySelectorAll('.screen.leaving,.screen.under').forEach(o=>o.remove());
 app.querySelectorAll('.screen').forEach(o=>{o.classList.remove('enter-push','enter-pop');o.style.transform='';o.style.transition=''});
 app.classList.remove('navlock');NAV.busy=false;
}
function clearTimers(){clearInterval(S._t);clearTimeout(S._t2);clearTimeout(S._lock);cancelAnimationFrame(S._raf)}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),1800)}
const stripIds=root=>root.querySelectorAll('[id]').forEach(n=>n.removeAttribute('id'));
function buildScreen(def){
 const el=document.createElement('div');
 el.className=`screen ${def.dark?'dark':''} ${def.tab?'has-tab':''}`;el.dataset.screen=S.screen;el.dataset.spot=S.spot;
 el.innerHTML=def.html+(def.tab?tabbar(def.tab):'');return el;
}

/* mode: 'none' 제자리 갱신(스크롤 유지) | 'push' 앞으로 | 'pop' 뒤로 */
function render(mode='none',restore){closeMission(true);
 closeSheet();cancelAnimationFrame(S._raf);
 if(!['move','arrive'].includes(S.screen))stopCam();
 const app=document.getElementById('app');
 const old=curScreen();
 const keep=(mode==='none'&&!restore&&old&&old.dataset.screen===S.screen&&old.dataset.spot===S.spot)?snapScroll(old):null;
 const def=SCREENS[S.screen]();
 document.getElementById('phone').classList.toggle('dk',!!def.dark);{const ph=document.getElementById('phone'),was=ph.classList.contains('land');const L=!!def.ar&&!PORTRAIT_CAM.has(spot().id);ph.classList.toggle('land',L);if(was!==L&&window.fitPhone)fitPhone()}
 const el=buildScreen(def);
 if(old)stripIds(old);
 if((mode==='push'||mode==='pop')&&old){
  NAV.busy=true;app.classList.add('navlock');
  old.classList.add('leaving',mode==='push'?'leave-push':'leave-pop');
  el.classList.add(mode==='push'?'enter-push':'enter-pop');
  if(mode==='push')app.appendChild(el);else app.insertBefore(el,old);
  NAV.animT=setTimeout(finishAnim,mode==='push'?380:330);
 }else{
  app.querySelectorAll('.screen').forEach(o=>o.remove());app.appendChild(el);
 }
 applyScroll(el,restore||keep);
 if(def.after)def.after();
 const up=el.querySelector('#upl');if(up)up.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{S.upload=r.result;S.scanQuery='';go('scanning')};r.readAsDataURL(f)};
 const cc=el.querySelector('#camcap');if(cc)cc.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{S.photo=r.result;S.camMode='photo';render();toast('사진 위에 AR을 입혔어요')};r.readAsDataURL(f)};
 const q=el.querySelector('#q');if(q)q.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();el.querySelector('[data-act="qsearch"]')?.click()}};
 drawFlow();
 const ed=document.getElementById('edge');if(ed)ed.classList.toggle('on',S.stack.length>0);
}

document.getElementById('app').addEventListener('change',e=>{const k=e.target.dataset&&e.target.dataset.pset;if(!k)return;S[k]=e.target.value;const sm=document.getElementById('poptsum');if(sm)sm.textContent=planOptSummary()});

/* ================= SWIPE BACK (왼쪽 가장자리 → 오른쪽 드래그) ================= */
const SWIPE={active:false};
(function(){
 const edge=document.getElementById('edge'),phone=document.getElementById('phone');
 let g=null;const W=390;
 const fit=()=>parseFloat(getComputedStyle(phone).getPropertyValue('--fit'))||1;
 const typing=()=>{const a=document.activeElement;return a&&(/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)||a.isContentEditable)};
 const blocked=()=>!S.stack.length||NAV.busy||document.getElementById('sheet').classList.contains('on');
 edge.addEventListener('pointerdown',e=>{
  if(e.button>0)return;
  g={x0:e.clientX,y0:e.clientY,lx:e.clientX,ly:e.clientY,id:e.pointerId,mode:null,v:[]};
  try{edge.setPointerCapture(e.pointerId)}catch(_){}
 });
 edge.addEventListener('pointermove',e=>{
  if(!g||e.pointerId!==g.id)return;const k=fit();
  const dx=(e.clientX-g.x0)/k,dy=(e.clientY-g.y0)/k;
  if(!g.mode&&(Math.abs(dx)>8||Math.abs(dy)>8)){
   g.mode=(dx>0&&Math.abs(dx)>Math.abs(dy)*1.2&&!blocked()&&!typing())?'swipe':'scroll';
   if(g.mode==='swipe')start();
  }
  if(g.mode==='swipe')move(dx);
  else if(g.mode==='scroll'){const b=curScreen()?.querySelector('.body');if(b)b.scrollTop-=(e.clientY-g.ly)/k}
  g.v.push([performance.now(),dx]);if(g.v.length>6)g.v.shift();g.lx=e.clientX;g.ly=e.clientY;
 });
 const up=e=>{
  if(!g||e.pointerId!==g.id)return;
  if(g.mode==='swipe'){const a=g.v[0],b=g.v[g.v.length-1];const vel=a&&b&&b[0]>a[0]?(b[1]-a[1])/(b[0]-a[0]):0;end(e.type!=='pointercancel'&&(SWIPE.x>W*.35||(vel>.45&&SWIPE.x>24)))}
  else if(!g.mode&&e.type==='pointerup'){edge.style.pointerEvents='none';const t=document.elementFromPoint(e.clientX,e.clientY);edge.style.pointerEvents='';if(t){if(/^(INPUT|TEXTAREA)$/.test(t.tagName))t.focus();else t.click()}}
  g=null;
 };
 edge.addEventListener('pointerup',up);edge.addEventListener('pointercancel',up);
 function start(){
  const cur=curScreen();if(!cur){g.mode='scroll';return}
  finishAnim();SWIPE.active=true;NAV.busy=true;SWIPE.x=0;
  const prev=S.stack[S.stack.length-1];const keep=[S.screen,S.spot];
  S.screen=prev.screen;S.spot=prev.spot;let def;try{def=SCREENS[prev.screen]()}finally{S.screen=keep[0];S.spot=keep[1]}
  const saveSS=S.screen,saveSp=S.spot;S.screen=prev.screen;S.spot=prev.spot;const under=buildScreen(def);S.screen=saveSS;S.spot=saveSp;
  stripIds(under);under.classList.add('under');under.insertAdjacentHTML('beforeend','<i class="shade"></i>');
  document.getElementById('app').insertBefore(under,cur);applyScroll(under,prev.scroll);
  cur.classList.add('dragging');SWIPE.cur=cur;SWIPE.under=under;
 }
 function move(dx){
  const x=Math.max(0,Math.min(W,dx));SWIPE.x=x;const p=x/W;
  SWIPE.cur.style.transform=`translate3d(${x}px,0,0)`;
  SWIPE.under.style.transform=`translate3d(${-W*.3*(1-p)}px,0,0)`;
  SWIPE.under.querySelector('.shade').style.opacity=String(1-p);
 }
 function end(commit){
  const {cur,under}=SWIPE;const T='transform .28s cubic-bezier(.2,.8,.2,1)';
  cur.style.transition=T;under.style.transition=T;const sh=under.querySelector('.shade');sh.style.transition='opacity .28s';
  requestAnimationFrame(()=>{
   if(commit){cur.style.transform=`translate3d(${W}px,0,0)`;under.style.transform='translate3d(0,0,0)';sh.style.opacity='0'}
   else{cur.style.transform='translate3d(0,0,0)';under.style.transform=`translate3d(${-W*.3}px,0,0)`;sh.style.opacity='1'}
  });
  setTimeout(()=>{
   SWIPE.active=false;NAV.busy=false;cur.classList.remove('dragging');
   if(commit){doBack('none');syncHist()}
   else{under.remove();cur.style.transform='';cur.style.transition=''}
  },290);
 }
})();

document.getElementById('app').addEventListener('click',e=>{
 const t=e.target.closest('[data-go],[data-act],[data-tab],[data-toast]');if(!t)return;
 if(t.dataset.toast){toast(t.dataset.toast);return}
 if(NAV.busy)return;
 if(t.dataset.tab){const n=t.dataset.tab;if(t.closest('.tabbar')){if(n==='scan')go('scan');else tabTo(n)}else go(n);return}
 if(t.dataset.go){if(t.dataset.sub)S.commTab=t.dataset.sub;if(t.dataset.go==='move')S.moveProg=0;
   go(t.dataset.go,{spot:t.dataset.id||null});return}
 const a=t.dataset.act;
 if(a!=='catmenu'&&a!=='homecat')document.querySelectorAll('.catmenu.on').forEach(m=>m.classList.remove('on'));
 switch(a){
  case 'back':back();break;
  case 'sample':S.upload=null;S.scanQuery='';go('scanning');break;
  case 'qchip':{const si=document.getElementById('srchq');if(si){si.value=t.dataset.q;si.dispatchEvent(new Event('input'));break}}{const qi=document.getElementById('q');if(qi)qi.value=t.dataset.q}S.scanQuery=t.dataset.q;S.upload=null;go('scanning');break;
  case 'qsearch':{const v=document.getElementById('q').value.trim();if(!v){toast('기억나는 장면을 적어주세요');break}S.scanQuery=v;S.upload=null;go('scanning');break}
  case 'route':S.route=+t.dataset.i;render();break;
  case 'rvwrite':openReviewSheet();break;
  case 'rvmore':{S.rvPage=S.rvPage||{};S.rvPage[S.spot]=(S.rvPage[S.spot]||0)+1;render();break}
  case 'rvlike':{S.rvLiked=S.rvLiked||{};const id=t.dataset.v;S.rvLiked[id]=!S.rvLiked[id];t.classList.toggle('on',S.rvLiked[id]);const n=t.querySelector('span');n.textContent=(+n.textContent)+(S.rvLiked[id]?1:-1);break}
  case 'gohome':tabTo('home');break;
  case 'pfrom':S.planFrom=t.dataset.v;planUpdate();break;
  case 'pmode':S.planMode=t.dataset.v;planUpdate();break;
  case 'popt':S.planOptOpen=!t.closest('details').open;break;
  case 'poptclear':S.planDate='';S.planArr='';curScreen().querySelectorAll('[data-pset]').forEach(i=>i.value='');document.getElementById('poptsum').textContent=planOptSummary();break;
  case 'savetrip':{const f=planFrom(spot()),m=MODES.find(x=>x.id===S.planMode),tr={spot:S.spot,date:planOptSummary().startsWith('날짜·')?'날짜 미정':planOptSummary(),status:'예정',from:f.name,mode:m.name};const i=S.trips.findIndex(x=>x.spot===S.spot);if(i>=0)S.trips[i]={...S.trips[i],...tr};else S.trips.push(tr);toast(`여정을 저장했어요 · ${f.name}에서 ${m.name}`);break}
  case 'sheet-exp':openExpSheet(t.dataset.ctx);break;
  case 'stampmission':openMission();break;
  case 'nextstep':{S.locked=false;replace('arrive');toast('장면 포인트에 도착했어요!');break}
  case 'sitemode':S.siteMode=t.dataset.v;render();break;
  case 'jjkmode':{const v=t.dataset.v;if(v==='pano'&&!HAS360.has(spot().id)){toast('360° 영상은 준비 중이에요');break}if(S.jjkMode===v){S.jjkMode=null}else{S.jjkMode=v;if(v==='overlay')S.jjkSlider=true}render();break}
  case 'capture':{const ctx=t.dataset.ctx;if(ctx==='site'&&S.siteMode!=='pano'&&!S.locked){toast('장면을 인식하는 중이에요. 잠시만요');break}const exp=ctx==='move'?MOVE_EXP.filter(x=>S.moveExp[x.id]).map(x=>x.name):[SITE_EXP.find(x=>x.id===S.siteMode).name];const fl=document.getElementById('flash');if(fl){fl.classList.remove('on');void fl.offsetWidth;fl.classList.add('on')}let img=null;try{img=captureAR(ctx)}catch(e){}S.lastCapture={ctx,exp:exp.length?exp:['일반 촬영'],img,src:{live:'실시간 카메라',photo:'사진',sim:'시뮬레이션'}[S.camMode]||''};setTimeout(()=>go('record'),180);break}
  case 'fxtoggle':{const tgt=S.screen==='move'?S.moveExp:S.siteFx;const keys=['anime','tone','sky'];const on=keys.some(k=>tgt[k]);const key=S.screen==='move'?'_fxm':'_fxs';if(on){S[key]=keys.reduce((a,k)=>(a[k]=tgt[k],a),{});keys.forEach(k=>tgt[k]=false)}else{const prev=S[key]||(S.screen==='move'?{anime:true,tone:true,sky:true}:{anime:true,tone:true,sky:false});keys.forEach(k=>tgt[k]=prev[k])}render();break}
  case 'camretry':S.camMode=null;render();break;
  case 'camsim':S.camMode='sim';render();break;
  case 'ctltoggle':{S.ctlHidden=!S.ctlHidden;document.getElementById('camctl')?.classList.toggle('hid',S.ctlHidden);break}
  case 'camflip':{if(S.camMode!=='live'){toast('실시간 카메라에서만 전환할 수 있어요');break}S.facing=S.facing==='user'?'environment':'user';stopCam();render();break}
  case 'savearchive':{const memo=(document.getElementById('memo')||{}).value||'';const d=new Date();S.archive.unshift({img:S.lastCapture&&S.lastCapture.img,spot:S.spot,date:`${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`,exp:S.lastCapture?S.lastCapture.exp:[],memo});const tr=S.trips.find(x=>x.spot===S.spot);if(tr)tr.status='완료';S.stack=[];S.archTab='timeline';S.screen='archive';render('push');syncHist();toast('아카이브에 저장했어요');break}
  case 'srchset':{const i=document.getElementById('srchq');if(i){i.value=t.dataset.v;i.dispatchEvent(new Event('input'))}break}
  case 'tripdel':{S.trips.splice(+t.dataset.i,1);render();toast('여정을 삭제했어요');break}
  case 'ework':S.exploreWork=t.dataset.v;render();break;
  case 'ecat':{S.exploreCat=t.dataset.v;const sc=curScreen(),body=sc&&sc.querySelector('.body');if(!body){render();break}
   sc.querySelectorAll('.chips .chip').forEach(c=>c.classList.toggle('on',c.dataset.v===S.exploreCat));
   const tmp=document.createElement('div');tmp.innerHTML=SCREENS.explore().html;const nb=tmp.querySelector('.body');
   const imgs=[...nb.querySelectorAll('img')].map(i=>{const im=new Image();im.src=i.src;return im.decode?im.decode().catch(()=>{}):Promise.resolve()});
   const tk=S._ecat=(S._ecat||0)+1;body.classList.add('xfade');
   Promise.race([Promise.all(imgs),new Promise(r=>setTimeout(r,600))]).then(()=>{if(tk!==S._ecat)return;body.innerHTML=nb.innerHTML;body.scrollTop=0;requestAnimationFrame(()=>body.classList.remove('xfade'))});
   break}
  case 'catmenu':{const m=t.closest('.topbar').querySelector('.catmenu');m.classList.toggle('on');break}
  case 'homecat':S.homeCat=t.dataset.v;render();toast(`${catName(S.homeCat)} 추천으로 바꿨어요`);break;
  case 'homeall':S.exploreCat='all';go('explore');break;
  case 'esel':S.exploreSel=t.dataset.v;render();break;
  case 'ctab':S.commTab=t.dataset.v;render();break;
  case 'atab':S.archTab=t.dataset.v;render();break;
  case 'bk':{S.saved=S.saved||{};S.saved[t.dataset.v]=!S.saved[t.dataset.v];if(S.saved[t.dataset.v]){const d=new Date();S.savedAt=S.savedAt||{};S.savedAt[t.dataset.v]=d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0')}const on=S.saved[t.dataset.v];document.querySelectorAll(`[data-act="bk"][data-v="${t.dataset.v}"]`).forEach(b=>b.classList.toggle('on',on));toast(on?'저장한 명소에 추가했어요':'저장을 취소했어요');break}
  case 'like':S.liked[t.dataset.i]=!S.liked[t.dataset.i];render();break;
  case 'postspot':{const ta=document.querySelector('#posttxt');S.postDraft=ta?ta.value:'';S.postSpot=t.dataset.v;render();break}
  case 'postsubmit':{const ta=document.querySelector('#posttxt'),v=(ta&&ta.value||'').trim();if(!v){toast('내용을 입력해 주세요');ta&&ta.focus();break}
   POSTS.unshift({id:'my'+Date.now(),u:'나',mine:true,spot:S.postSpot,t:'방금',txt:v,like:0,c:0});S.postDraft='';S.commTab='feed';back();toast('AR 기록 피드에 등록했어요');break}
 }
});

/* ================= SIDE FLOW NAV ================= */
const FLOW=[
 ['1. 장면 발견',[['scan','장면 검색 (캡처·설명)'],['scanresult','검색 결과 · 장면 매칭']]],
 ['2. 장소 탐색',[['explore','성지 지도 탐색'],['spot','장소 상세 · 장면 비교']]],
 ['3. 방문 계획',[['plan','경로 · 이동수단 · 예약']]],
 ['4. 이동 경험',[['move','이동 AR · 캐릭터 필터']]],
 ['5. 현장 경험',[['arrive','현장 AR · 오버레이 · 360°']]],
 ['6. 기록 · 공유',[['record','촬영 결과 · 공유'],['archive','덕질 아카이브']]],
 ['서브',[['home','홈'],['community','커뮤니티 · 굿즈']]],
];
function drawFlow(){
 const el=document.getElementById('flow');if(!el)return;let n=0;
 el.innerHTML=FLOW.map(([g,items])=>`<div><div class="grp-t">${g}</div>${items.map(([id,l])=>`<button data-jump="${id}" class="${S.screen===id||(S.screen==='scanning'&&id==='scan')?'on':''}"><span class="n">${++n}</span>${l}</button>`).join('')}</div>`).join('');
}
document.getElementById('flow')?.addEventListener('click',e=>{const b=e.target.closest('[data-jump]');if(!b)return;clearTimers();const id=b.dataset.jump;
 if(['spot','plan','move','arrive','record','scanresult'].includes(id)){S.spot=S.spot||'kamakura'}
 if(id==='move')S.moveProg=0;
 finishAnim();S.stack=TOP.includes(id)?[]:[{screen:'home',spot:S.spot,scroll:null}];S.screen=id;render();syncHist();});

/* ================= iPhone 14 FIT ================= */
(function(){const ph=document.getElementById('phone');
 /* 카메라 화면은 가로 촬영: 프레임을 844×390으로 돌리고, 세로로 든 휴대폰에서는 90° 회전해 가득 채워요 */
 const fit=()=>{if(document.documentElement.classList.contains('native')){ph.style.setProperty('--fit','1');ph.style.setProperty('--rot','0deg');return}const land=ph.classList.contains('land'),W=land?868:414,H=land?414:868,rot=false;
  const k=rot?Math.min(1,(innerHeight-24)/W,(innerWidth-24)/H):Math.min(1,(innerWidth-24)/W,(innerHeight-24)/H);
  ph.style.setProperty('--fit',k.toFixed(4));ph.style.setProperty('--rot',rot?'90deg':'0deg')};
 window.fitPhone=fit;fit();addEventListener('resize',fit);})();

/* ================= SPLASH ================= */
(function(){const sp=document.getElementById('splash'),ph=document.getElementById('phone');
 const hide=()=>{sp.classList.add('off');ph.classList.remove('splash-on')};
 sp.onclick=hide;setTimeout(hide,1800);})();

/* ================= INIT ================= */
(function(){let h='';try{h=location.hash.slice(1)}catch(e){}
 if(h&&SCREENS[h]&&h!=='scanning'){S.screen=h;if(!TOP.includes(h))S.stack=[{screen:'home',spot:S.spot,scroll:null}]}
 try{history.replaceState({dm:0},'','#'+(S.stack.length?'home':S.screen))}catch(e){}
 render();syncHist();
 document.addEventListener('click',e=>{if(!e.target.closest('.catmenu,[data-act="catmenu"]'))document.querySelectorAll('.catmenu.on').forEach(m=>m.classList.remove('on'))},true);
})();
