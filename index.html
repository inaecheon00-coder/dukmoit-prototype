<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f9fb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="덕모잇">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<script>/* 터치 폰이면 프레임 없는 앱 화면으로 */(function(){try{var m=function(q){return window.matchMedia&&matchMedia(q).matches};var phone=(m('(pointer:coarse)')&&Math.min(screen.width,screen.height)<600)||m('(display-mode: standalone)')||navigator.standalone;if(phone){var d=document.documentElement;d.classList.add('native');var ios=!!navigator.standalone;if(ios)d.classList.add('iospwa');var sz=function(){var w=window.innerWidth,h=window.innerHeight;
 /* iOS 홈 화면 앱(상태바 투명)은 화면 높이가 상태바만큼 짧게 잡히는 버그가 있어 실제 화면 크기로 맞춰요 */
 if(ios){var a=Math.max(screen.width,screen.height),b=Math.min(screen.width,screen.height);if(w<=h){w=b;h=a}else{w=a;h=b}}
 d.style.setProperty('--vw',w+'px');d.style.setProperty('--vh',h+'px')};sz();addEventListener('resize',sz);addEventListener('orientationchange',function(){setTimeout(sz,300)})}}catch(e){}})();</script>
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="icon" type="image/png" href="assets/icon-192.png">
<title>덕모잇</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;900&family=Black+Han+Sans&family=Dela+Gothic+One&display=swap">
<style>
/* 산돌프레스: 라이선스 폰트라 CDN이 없어요. fonts/ 폴더에 파일을 넣으면 자동 적용, 없으면 기기에 설치된 폰트 → Pretendard Black 순으로 대체 */
@font-face{font-family:"Sandoll Press";font-weight:400 900;font-display:swap;
  src:local("Sandoll Press"),local("SandollPress"),local("산돌프레스"),local("Sandoll Press 05"),
      url("fonts/SandollPress.woff2") format("woff2"),url("fonts/SandollPress.woff") format("woff"),url("fonts/SandollPress.otf") format("opentype")}
:root{
  /* Figma 덕모잇 디자인 토큰 */
  --b:#0078e9; --b-deep:#005fc0; --b-light:#a3cdff; --b-weak:#eaf3fd; --b-ink:#06f;
  --bg:#f7f9fb; --surface:#fff; --line:rgba(226,232,240,.8); --line2:#d5dee8;
  --text:#191c1e; --sub:#414753; --sub2:#696969; --mute:#94a3b8; --navy:#0f172a; --slate:#64748b;
  --accent:var(--b); --accent-weak:var(--b-weak);
  --ph:#e6eef7; --ph2:#d6e3f1;
  --bubble:radial-gradient(ellipse 95% 100% at 49% 50%,#6baeff 0%,#50a1fa 25%,#3693f4 50%,#1b86ef 75%,#0078e9 100%);
  --f-body:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo","Pretendard Variable",Pretendard,sans-serif;
  --f-press:"Black Han Sans","Dela Gothic One",var(--f-body);   /* 산돌프레스 대체: 한글 Black Han Sans · 일본어 Dela Gothic One (무료 Google Fonts) */
  --r:16px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
html,body{overscroll-behavior:none}
body{font-synthesis-weight:none;-webkit-tap-highlight-color:transparent;font-family:var(--f-body);letter-spacing:-.01em;background:var(--bg);color:var(--text);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}

/* ---------- layout: 모바일 웹 전용 ---------- */
.wrap{min-height:100dvh;display:flex;justify-content:center;align-items:center;background:#e9e9ee}
.phone{width:100%;height:100dvh;flex:none;background:var(--surface);position:relative;overflow:hidden;overflow:clip}
.screen{position:absolute;inset:0;padding-top:var(--sat);display:flex;flex-direction:column;background:var(--surface)}
.screen.dark{background:#0d0d10;color:#fff}
.body{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.body::-webkit-scrollbar{display:none}
/* PC에서 열면 모바일 화면 크기로 표시 */
@media all{
  .phone{width:390px;height:844px;border-radius:28px;box-shadow:0 20px 50px -18px rgba(0,0,0,.3)}
}
input,textarea{font-size:17px}
button{touch-action:manipulation;user-select:none;-webkit-user-select:none}

/* ---------- common ---------- */
.hdr{height:52px;display:flex;align-items:center;gap:8px;padding:0 12px;flex:none}
.hdr .t{flex:1;font-size:17px;font-weight:700;text-align:center;margin-right:36px}
.hdr .t.left{text-align:left;margin:0 0 0 6px;font-size:20px}
.ib{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none}
.ib:hover{background:rgba(127,127,127,.12)}
.ib svg{width:22px;height:22px}
.pad{padding:0 20px}
.sec{margin-top:24px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;padding:0 20px;margin-bottom:10px}
.sec-h h3{font-size:17px;font-weight:700}
.sec-h a{font-size:15px;color:var(--sub);cursor:pointer}
.chip{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 12px;border-radius:14px;border:1px solid var(--line2);font-size:15px;white-space:nowrap;background:var(--surface)}
.chip.on{background:var(--text);border-color:var(--text);color:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;padding:0 20px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.tag{display:inline-block;font-size:15px;padding:2px 8px;border-radius:6px;background:var(--ph);color:var(--sub)}
.tag.ac{background:var(--accent-weak);color:var(--accent);font-weight:500}
.btn{height:50px;border-radius:12px;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:6px;width:100%}
.btn.pri{background:var(--text);color:#fff}
.btn.sec2{background:var(--ph);color:var(--text)}
.btn.out{border:1px solid var(--line2)}
.btn.sm{height:38px;font-size:15px;border-radius:10px}
.card{border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.muted{color:var(--sub)}
.small{font-size:15px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.divider{height:8px;background:var(--bg);margin:24px 0 0}
.cta{flex:none;padding:12px 20px max(var(--sab),16px);border-top:1px solid var(--line);background:var(--surface);display:flex;gap:8px}
.hscroll{display:flex;gap:12px;overflow-x:auto;padding:0 20px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}

/* placeholder image */
.ph{position:relative;background:var(--ph);border-radius:10px;overflow:hidden;display:flex;align-items:flex-end}
.ph::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,transparent 0 10px,rgba(0,0,0,.035) 10px 20px)}
.ph .lb{position:relative;margin:8px;font-size:15px;color:var(--sub);background:rgba(255,255,255,.85);padding:2px 6px;border-radius:4px}
.ph .x{position:absolute;inset:0;display:grid;place-items:center;font-size:15px;color:var(--mute);text-align:center;padding:8px}

/* tab bar */
.tabbar{position:absolute;left:0;right:0;bottom:0;z-index:70;height:calc(62px + max(var(--sab),12px));border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:max(var(--sab),12px);background:rgba(255,255,255,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.screen.has-tab .body{padding-bottom:calc(62px + max(var(--sab),12px))}
.tabbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:15px;color:var(--mute)}
.tabbar button.on{color:var(--text);font-weight:700}
.tabbar svg{width:22px;height:22px}
.tabbar .scan{margin-top:-18px}
.tabbar .scan span.c{width:54px;height:54px;border-radius:50%;background:var(--text);color:#fff;display:grid;place-items:center;box-shadow:0 6px 16px rgba(0,0,0,.2)}

/* bottom sheet / toast */
.dim{position:absolute;inset:0;background:rgba(0,0,0,.4);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.dim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:41;background:var(--surface);color:var(--text);border-radius:20px 20px 0 0;padding:10px 20px 30px;transform:translateY(100%);transition:transform .25s ease,visibility 0s .25s;visibility:hidden;max-height:82%;overflow-y:auto}
.sheet.on{transform:none;visibility:visible;transition:transform .25s ease}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line2);margin:0 auto 14px}
.toast{position:absolute;left:50%;top:100px;transform:translateX(-50%) translateY(10px);background:#222;color:#fff;font-size:15px;padding:10px 16px;border-radius:10px;opacity:0;transition:.2s;z-index:60;white-space:nowrap;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}

/* toggle */
.tg{width:44px;height:26px;border-radius:13px;background:var(--line2);position:relative;flex:none;transition:.15s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.tg.on{background:var(--accent)}
.tg.on::after{left:21px}

/* segmented */
.seg{display:flex;background:var(--ph);border-radius:10px;padding:3px}
.seg button{flex:1;height:32px;border-radius:8px;font-size:15px;color:var(--sub)}
.seg button.on{background:var(--surface);color:var(--text);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.dark .seg{background:rgba(255,255,255,.12)}
.dark .seg button{color:rgba(255,255,255,.65)}
.dark .seg button.on{background:#fff;color:#111}

/* ----- AR camera sim ----- */
.cam{position:absolute;inset:0;overflow:hidden;background:linear-gradient(#3b3f4a 0%,#555a66 48%,#2b2d33 48.2%,#1f2025 100%)}
.cam .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:40px 40px}
.cam .camlb{position:absolute;top:calc(var(--sat) + 150px);left:50%;transform:translateX(-50%);font-size:15px;color:rgba(255,255,255,.45);letter-spacing:.05em}
.cam.tone{filter:sepia(.35) saturate(1.6) hue-rotate(-15deg) brightness(1.05)}
.person{position:absolute;bottom:30%;width:46px;border-radius:23px 23px 6px 6px;background:rgba(255,255,255,.18)}
.person .tagp{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:6px;font-size:15px;white-space:nowrap;padding:3px 7px;border-radius:6px;background:rgba(0,0,0,.55);color:#fff;border:1px solid rgba(255,255,255,.35);opacity:0;transition:.2s}
.cam.filter .person{background:rgba(160,170,255,.45);outline:2px dashed rgba(200,205,255,.8);outline-offset:2px}
.cam.filter .person .tagp{opacity:1}
.hud{position:absolute;inset:0;pointer-events:none}
.ov{position:absolute;z-index:5}
.pill{background:rgba(20,20,24,.7);backdrop-filter:blur(8px);color:#fff;border-radius:14px;padding:10px 14px}
.dark .ib:hover{background:rgba(255,255,255,.12)}
.rb{width:72px;height:72px;border-radius:50%;border:4px solid #fff;display:grid;place-items:center}
.rb span{width:56px;height:56px;border-radius:50%;background:#fff}
.cb{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:15px;color:rgba(255,255,255,.85)}
.cb i{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;font-style:normal}
.cb svg{width:22px;height:22px}

/* overlay blend */
.scene-layer{position:absolute;inset:0;background:linear-gradient(#f4a261 0%,#e76f51 40%,#5c4d7d 48%,#2a2438 100%);mix-blend-mode:normal}
.scene-layer .sl{position:absolute;inset:0;display:grid;place-items:center;font-size:15px;color:rgba(255,255,255,.8)}
.scene-layer .cross{position:absolute;left:0;right:0;top:52%;height:14px;background:repeating-linear-gradient(90deg,#fff 0 18px,#222 18px 36px);opacity:.6}
.pano{position:absolute;inset:0;overflow:hidden;cursor:grab;touch-action:none}
.pano-strip{position:absolute;top:0;bottom:0;left:0;display:flex;will-change:transform}
.pano-strip div.pv{background:#1a1d26 center/cover no-repeat;align-items:end;padding-bottom:70px}
.pano-strip div.pv.right{background-position:right center}.pano-strip div.pv.left{background-position:left center}
.pano-strip div.pv.flip{transform:scaleX(-1);filter:brightness(.75)}.pano-strip div.pv.flip span{transform:scaleX(-1)}
.pano-strip div.pv span{background:rgba(0,0,0,.45);padding:4px 12px;border-radius:999px}
.phone.land .pano-strip div{width:844px}
html.native .phone.land .pano-strip div{width:var(--vw,100vw)}
.pano-strip div{width:390px;flex:none;position:relative;display:grid;place-items:center;color:rgba(255,255,255,.85);font-size:15px;text-align:center}
.compass{position:absolute;top:calc(var(--sat) + 130px);left:50%;transform:translateX(-50%);font-size:15px;color:#fff;background:rgba(0,0,0,.4);padding:4px 10px;border-radius:10px;z-index:6}
input[type=range]{width:100%;accent-color:#fff}


/* AR camera */
.camwrap{position:absolute;inset:0;overflow:hidden;background:#000}
.camwrap video,.camwrap img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.camwrap{background:#000}
.camwrap .cam{display:none}.camwrap.sim .cam{display:none}
.camwrap.sim video,.camwrap.sim img.bg{display:none}
#arcv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
#glcv{position:absolute;inset:0;width:100%;height:100%;z-index:1;display:none}
.camwrap.fx .cam{display:none}
.fxbar{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.pill.fxon{background:#4f46e5}
.camfb{left:16px;right:16px;top:50%;transform:translateY(-50%);background:rgba(20,20,24,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;border-radius:18px;padding:20px;z-index:9}
.reticle{position:absolute;left:50%;top:46%;width:230px;height:230px;transform:translate(-50%,-50%);z-index:4;transition:opacity .4s,transform .4s}
.reticle i{position:absolute;width:34px;height:34px;border:3px solid #fff;animation:rt 1.2s ease-in-out infinite}
.reticle i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0}.reticle i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0}
.reticle i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0}.reticle i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0}
@keyframes rt{50%{transform:scale(.85)}}
.reticle .rt{position:absolute;top:100%;left:-40px;right:-40px;text-align:center;margin-top:14px;font-size:15px;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.reticle.done{opacity:0;transform:translate(-50%,-50%) scale(1.3)}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:80}
.flash.on{animation:fl .35s ease-out}
@keyframes fl{0%{opacity:.9}100%{opacity:0}}
/* scan */
.drop{border:1.5px dashed var(--line2);border-radius:16px;padding:28px 16px;text-align:center;cursor:pointer;display:block}
.drop:hover{border-color:var(--text)}
.scanbox{position:relative;width:240px;height:240px;margin:20px auto;border-radius:16px;overflow:hidden}
.scanline{position:absolute;left:0;right:0;height:2px;background:var(--accent);box-shadow:0 0 12px var(--accent);animation:sl 1.4s ease-in-out infinite}
@keyframes sl{0%{top:0}50%{top:calc(100% - 2px)}100%{top:0}}
.match{display:inline-block;font-size:15px;font-weight:700;color:var(--accent)}
.bar{height:6px;border-radius:3px;background:var(--ph);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}

/* map */
.map{position:relative;height:300px;background:#ececf0;overflow:hidden}
.map::before{content:"";position:absolute;inset:0;background-image:linear-gradient(#dedee4 1px,transparent 1px),linear-gradient(90deg,#dedee4 1px,transparent 1px);background-size:32px 32px}
.map .land{position:absolute;background:#e0e0e6;border-radius:40% 55% 50% 45%}
.pin{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;cursor:pointer}
.pin b{background:var(--text);color:#fff;font-size:15px;font-weight:500;padding:3px 7px;border-radius:8px;white-space:nowrap}
.pin i{width:2px;height:8px;background:var(--text)}
.pin.on b{background:var(--accent)}
.pin.on i{background:var(--accent)}

/* timeline */
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl .st{position:relative;padding:0 0 16px}
.tl .st::before{content:"";position:absolute;left:-21px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--line2)}
.tl .st.done::before{background:var(--text);border-color:var(--text)}
.tl .st.cur::before{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-weak)}

.stamp{aspect-ratio:1;border-radius:50%;border:1.5px dashed var(--line2);display:grid;place-items:center;text-align:center;font-size:15px;color:var(--mute);padding:6px}
.stamp.got{border:2px solid var(--text);color:var(--text);font-weight:700}
.av{width:32px;height:32px;border-radius:50%;background:var(--ph2);flex:none}
.opt{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line)}
.opt:last-child{border-bottom:0}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--line2);flex:none;margin-top:1px}
.radio.on{border:6px solid var(--text)}
.field{border:1px solid var(--line2);border-radius:10px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center}
textarea{width:100%;border:1px solid var(--line2);border-radius:10px;padding:12px;resize:none;height:84px}
.search{display:flex;align-items:center;gap:8px;height:46px;border-radius:12px;background:var(--ph);padding:0 14px;color:var(--mute);cursor:pointer}
.search input{border:0;background:none;outline:none;flex:1;color:var(--text)}
.search svg{width:18px;height:18px;flex:none}

/* =====================================================================
   덕모잇 테마 — Figma 디자인 적용 (색상 · 폰트 · 컴포넌트)
   ===================================================================== */
.press{font-family:var(--f-press);font-weight:700;letter-spacing:-.02em}
.wrap{background:#dfe8f2;height:100dvh;min-height:0;overflow:hidden}
/* 아이폰 14 (390×844) 고정: 화면이 작으면 비율 그대로 축소만 */
.phone{transform-origin:center center;transform:rotate(var(--rot,0deg)) scale(var(--fit,1))}
.phone.land{width:844px!important;height:390px!important;--sat:0px;--sab:0px}
.phone.land .sbar{display:none}
.phone.land .tabbar{display:none}
/* 가로 카메라 배치 */
.cam-top{top:14px;left:60px;right:60px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.cam-top .mguide{max-width:380px;flex:0 1 auto;text-align:left}
.cam-head{display:flex;align-items:stretch;gap:8px}
.fxbar.fxcol{flex-direction:column;align-items:stretch;justify-content:center;gap:6px;margin:0;flex-wrap:nowrap}
.fxbar.fxcol>*{margin:0!important;justify-content:center;white-space:nowrap}
.phone.land .cam-left{display:none}
.phone:not(.land) .fxbar.fxcol{display:none}
.phone:not(.land) .cam-head{display:contents}
.phone:not(.land) .ctl-grab{display:none}
.phone.land .cam-rail{top:14px;bottom:20px;transform:none;justify-content:space-between}
.phone.land .cam-rail .rb{margin:auto 0}
.phone.land .cam-rail .arb-end{margin-top:0}
/* 출발·도착 박스: 내용 가로세로 가운데 */
.cam-top .mguide{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center!important}
.cam-top .mguide .mg-route,.cam-top .mguide .mg-meta{justify-content:center}
.cam-top .mguide .mg-meta{gap:14px}
/* 애니 화풍 = 뱃지 버튼과 같은 디자인 */
.fxbar .stampbtn{margin-left:0;justify-content:center}
.fxbar.fxcol .stampbtn{min-width:132px}
.cam-left{display:none!important}
.phone.land .cam-rail .rb{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);margin:0}
/* 세로 카메라(너의이름은): 박스 아래 두 버튼 나란히, 촬영 버튼 가운데 */
.phone:not(.land) .cam-head{display:flex!important;flex-direction:column;align-items:stretch;gap:8px;flex:1;min-width:0}
.phone:not(.land) .fxbar.fxcol{display:flex!important;flex-direction:row;justify-content:center;gap:8px}
.phone:not(.land) .fxbar.fxcol .stampbtn{min-width:0;flex:0 1 auto}
.phone:not(.land) .cam-rail{display:grid!important;grid-template-columns:1fr auto 1fr;align-items:center}
.phone:not(.land) .cam-rail>:first-child{justify-self:start}
.phone:not(.land) .cam-rail>:last-child{justify-self:end}
.arth{position:relative;height:70px;border-radius:10px;overflow:hidden;background:#2a3140 center/cover no-repeat}
.arth-ov{position:absolute;inset:0;background:center/cover no-repeat;opacity:.6}
.arth-ch{position:absolute;left:14%;bottom:-6px;height:118%}
.arth span{position:absolute;right:6px;bottom:6px;font-size:12px;font-weight:700;color:#fff;background:rgba(0,0,0,.5);padding:2px 7px;border-radius:999px}
.jjk-ctl{left:60px;bottom:16px;display:flex;flex-direction:column;align-items:flex-start;gap:10px}
html.native .phone.land .jjk-ctl{left:calc(env(safe-area-inset-left,0px) + 16px)}
.jjk-modes{display:flex;flex-direction:column;gap:8px}
.jjk-modes button{min-width:104px;height:42px;padding:0 16px;border-radius:999px;font-size:15px;font-weight:600;color:#fff;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.8);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.jjk-modes button.on{background:#0078e9;border-color:#0078e9}
.jjk-slider{width:300px;padding:8px 14px;animation:jjkIn .2s ease}
@keyframes jjkIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.phone.land .v360~.compass{top:auto;bottom:22px}
.v360 video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.charlayer{position:absolute;left:20%;right:50%;bottom:0;top:16%;display:flex;align-items:flex-end;justify-content:center;pointer-events:none;z-index:3}
.charlayer img{max-height:100%;max-width:90%;object-fit:contain}
.charlayer .char-ph{width:46%;height:78%;border:2px dashed rgba(255,255,255,.75);border-radius:999px 999px 18px 18px;display:grid;place-items:center;text-align:center;color:#fff;font-size:15px;font-weight:600;background:rgba(0,0,0,.18)}
.charlayer.ok .char-ph{display:none}
.phone:not(.land) .charlayer{left:0;right:40%;top:26%;bottom:0}
.phone:not(.land) .jjk-ctl{left:auto;right:16px;align-items:flex-end;bottom:calc(max(var(--sab),20px) + 96px)}
.phone:not(.land) .jjk-modes button{min-width:92px}
.cam-ctl{transition:transform .28s ease,opacity .28s ease}
.phone.land .cam-ctl{left:50%!important;right:auto;width:400px;bottom:10px;transform:translateX(-50%);touch-action:none;display:flex;flex-direction:column;align-items:stretch}
.phone.land .cam-ctl.hid{transform:translate(-50%,calc(100% - 22px))}
.phone.land .cam-ctl.hid>*:not(.ctl-grab){opacity:0;pointer-events:none}
.ctl-grab{align-self:center;width:72px;height:22px;display:grid;place-items:center;margin-bottom:2px}
.ctl-grab i{display:block;width:44px;height:5px;border-radius:3px;background:rgba(255,255,255,.75);box-shadow:0 1px 3px rgba(0,0,0,.4)}
.cam-top .mguide .mg-route{justify-content:center}
.cam-top>span{width:44px}
.cam-left{top:66px;left:60px;width:330px}
.cam-left .fxbar{margin-top:0}
.cam-left .fxbar{margin-top:8px}
.cam-bl{bottom:14px;left:60px;width:360px}
.cam-bl .seg{background:rgba(20,20,24,.6)}
.cam-chips{display:flex;flex-wrap:wrap;gap:6px}
.cam-rail{right:28px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:10px}
.cam-rail .arb{min-width:92px;height:62px;padding:6px 10px}
.cam-rail .rb{width:66px;height:66px}
.phone:not(.land) .cam-top{top:calc(var(--sat) + 12px);left:16px;right:16px}
.phone:not(.land) .cam-top .mguide{flex:1}
.phone:not(.land) .cam-left{top:calc(var(--sat) + 120px);left:16px;right:16px;width:auto}
.phone:not(.land) .cam-bl{left:16px;right:16px;width:auto;bottom:calc(max(var(--sab),20px) + 96px)}
.phone:not(.land) .cam-rail{top:auto;transform:none;left:16px;right:16px;bottom:max(var(--sab),20px);flex-direction:row;justify-content:space-between}
.phone.land .camfb{left:50%;right:auto;width:420px;margin-left:-210px}
.phone.land .sheet{left:50%;right:auto;width:560px;margin-left:-280px;max-height:94%;overflow-y:auto}
/* 깜짝 미션 팝업 가로 배치 */
.phone.land .ms-x{top:14px;right:24px}
.phone.land .mission{align-items:center;justify-content:center}



.phone.land .ms-tag{margin-bottom:6px}
.phone.land .ms-hint{margin-top:12px;justify-content:center}

.screen,.screen .body{background:var(--bg)}
.screen.dark,.screen.dark .body{background:#0d0d10}

/* 아이폰 14 프레임 (390×844) + 상태바 — PC에서 열 때 */
.sbar{display:none}
@media all{
  .phone{width:390px;height:844px;border-radius:47px;box-shadow:0 0 0 10px #111,0 0 0 12px #2b2b2e,0 30px 60px -20px rgba(0,40,90,.45)}
  .phone{--sat:47px;--sab:22px}
  .sbar{display:flex;position:absolute;top:0;left:0;right:0;height:47px;z-index:101;align-items:center;justify-content:space-between;padding:4px 30px 0 44px;pointer-events:none;color:#000;font:600 17px/1 -apple-system,"SF Pro Text",var(--f-body);letter-spacing:-.02em}
  .sbar .ic{display:flex;gap:6px;align-items:center}
  .sbar::after{content:"";position:absolute;left:50%;top:11px;width:122px;height:34px;margin-left:-61px;border-radius:20px;background:#000}
  .phone.dk .sbar,.phone.splash-on .sbar{color:#fff}
  .phone::after{content:"";position:absolute;left:50%;bottom:8px;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:rgba(0,0,0,.85);z-index:102;pointer-events:none}
  .phone.dk::after,.phone.splash-on::after{background:rgba(255,255,255,.85)}
}

/* header */
.hdr{height:56px;padding:0 12px}
.hdr .t{font-size:17px;font-weight:700;color:var(--navy)}
.hdr .t.left{font-family:var(--f-press);font-weight:400;font-size:26px;color:#0b2a4a;letter-spacing:-.02em;margin-left:8px;transform:skewX(-6deg);transform-origin:left;display:inline-block}
.ib{color:var(--b)}
.dark .ib{color:#fff}
.ib:hover{background:var(--b-weak)}

/* 홈 헤더: 로고 + 검색 pill (Figma: 전체 ▾ | 떠나고 싶은 애니 속으로 🔍) */
.topbar{flex:none;padding:10px 18px 6px;display:flex;flex-direction:column;gap:12px}
.topbar .r1{display:flex;align-items:center;justify-content:space-between}
.topbar .logo-img{height:38px;width:auto;display:block}
.qpill{display:flex;align-items:center;gap:8px;height:45px;padding:0 12px 0 14px;border:1px solid var(--b-light);border-radius:30px;background:#fff;color:var(--b);font-size:17px;font-weight:500;cursor:pointer;flex:1;min-width:0}
.qpill .cat{display:flex;align-items:center;gap:4px;flex:none}
.qpill .cat svg{width:15px;height:15px}
.qpill .bar1{width:1px;height:18px;background:var(--b);border-radius:5px;flex:none}
.qpill .ph-t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qpill>svg{width:20px;height:20px;flex:none;stroke-width:2.6}
.me{width:34px;height:34px;flex:none;color:var(--b);display:grid;place-items:center}
.me svg{width:30px;height:30px}

/* section */
.sec{margin-top:28px}
.sec-h{align-items:center;padding:0 24px;margin-bottom:12px}
.sec-h h3{font-size:20px;font-weight:700;color:var(--b);letter-spacing:.01em}
.sec-h a{font-size:15px;color:var(--sub2)}

/* card · button · chip · tag */
.card{border:1px solid var(--line);border-radius:16px;background:#fff}
.card.lg{border-radius:20px;border-color:rgba(0,120,233,.05)}
.btn{height:50px;border-radius:14px;font-size:17px;font-weight:600}
.btn.pri{background:var(--b);color:#fff;box-shadow:0 6px 16px -8px rgba(0,120,233,.7)}
.btn.pri:active{background:var(--b-deep)}
.btn>svg{width:22px;height:22px;flex:none}
.btn.sm>svg{width:16px;height:16px}
.btn.pri .go{display:inline-flex;margin-left:10px}
.btn.pri .go svg{width:16px;height:16px;transform:rotate(180deg)}
.btn.sec2{background:var(--b-weak);color:var(--b)}
.btn.out{border:1px solid var(--b-light);color:var(--b);background:#fff}
.btn.sm{height:38px;font-size:15px;border-radius:12px}
.chip{height:32px;padding:0 14px;border-radius:16px;border-color:var(--b-light);color:var(--b);font-size:15px;font-weight:500}
.chip.on{background:var(--b);border-color:var(--b);color:#fff}
.tag{font-size:15px;padding:4px 8px;border-radius:6px;background:var(--b-weak);color:var(--b);font-weight:500}
.tag.ac{background:var(--b);color:#fff}
.muted{color:var(--slate)}
.divider{background:var(--bg)}
.cta{background:#fff;border-top:1px solid var(--line)}
.field{border-color:var(--line2);border-radius:12px;background:#fff}
textarea{border-color:var(--line2);border-radius:12px;background:#fff}
.search{background:#fff;border:1px solid var(--b-light);border-radius:30px;color:var(--b);height:45px}
.search input::placeholder{color:var(--mute)}
.search svg{stroke-width:2.6}
.drop{border-color:var(--b-light);background:#fff;border-radius:20px}
.drop:hover{border-color:var(--b)}
.av{background:linear-gradient(135deg,#0b3a6b,#0f2a4a)}

/* placeholder 이미지 (블루 톤) */
.ph{background:linear-gradient(160deg,#eaf3fd,#d8e7f7);border-radius:12px}
.ph::before{background:repeating-linear-gradient(135deg,transparent 0 10px,rgba(0,120,233,.05) 10px 20px)}
.ph .lb{color:var(--b);background:rgba(255,255,255,.9);font-weight:500}
.ph .x{color:#7aa6d6}

/* 말풍선 (Figma: 블루 래디얼 그라데이션 + 집중선) */
.bubble{position:relative;background:var(--bubble);color:#f7f9fb;border-radius:15px;padding:14px 18px;font-weight:500;overflow:hidden;isolation:isolate}
.bubble::before{content:"";position:absolute;inset:-40%;z-index:-1;background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,255,255,.22) 0 .8deg,transparent .8deg 7deg);-webkit-mask:radial-gradient(closest-side,transparent 55%,#000 100%);mask:radial-gradient(closest-side,transparent 55%,#000 100%)}
.bubble.tail::after{content:"";position:absolute;left:26px;bottom:-12px;width:22px;height:16px;background:#1b86ef;clip-path:polygon(0 0,100% 0,10% 100%)}

/* tab bar */
.tabbar{background:rgba(255,255,255,.94);border-top:1px solid var(--line)}
.tabbar button{color:var(--mute);font-size:15px}
.tabbar button.on{color:var(--b);font-weight:700}
.tabbar .scan{color:var(--b);font-weight:600}
.tabbar .scan span.c{background:var(--bubble);box-shadow:0 8px 18px -6px rgba(0,120,233,.65)}

/* toggle · seg · misc */
.tg.on{background:var(--b)}
.seg{background:var(--b-weak);border-radius:12px}
.seg button{color:var(--slate);border-radius:9px}
.seg button.on{color:var(--b);box-shadow:0 1px 3px rgba(0,60,120,.12)}
.radio.on{border-color:var(--b)}
.match{color:var(--b)}
.bar{background:#e6eef7;height:8px;border-radius:4px}
.bar i{background:var(--b);border-radius:4px}
.scanline{background:var(--b);box-shadow:0 0 12px var(--b)}
.pill.fxon{background:var(--b)}
.map{background:#eaf1f8}
.map::before{background-image:linear-gradient(#dbe6f2 1px,transparent 1px),linear-gradient(90deg,#dbe6f2 1px,transparent 1px)}
.map .land{background:#d6e4f3}
.pin b{background:var(--navy)}
.pin i{background:var(--navy)}
.pin.on b,.pin.on i{background:var(--b)}
.tl .st.done::before{background:var(--b);border-color:var(--b)}
.tl .st.cur::before{border-color:var(--b)}
.stamp.got{border-color:var(--b);color:var(--b);background:var(--b-weak)}
.toast{background:var(--navy);border-radius:12px}
.sheet{border-radius:24px 24px 0 0}
.opt{border-bottom-color:var(--line)}

/* 실시간 인기 검색어 (Figma 검색 화면) */
.rank{padding:18px 18px 14px}
.rank-flat{background:none!important;border:0!important;box-shadow:none!important;padding:0!important;border-radius:0!important}
.rk-top{position:relative;isolation:isolate;overflow:hidden;height:64px;border-radius:16px;margin:0 0 16px;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;color:#fff;
 background:radial-gradient(ellipse 72% 78% at 50% 50%,#6baeff 0%,#50a1fa 25%,#3693f4 50%,#1b86ef 75%,#0078e9 100%);animation:rkPop .7s cubic-bezier(.2,1.8,.4,1) both}
.rk-top .fx{position:absolute;inset:0;z-index:-1;overflow:hidden;border-radius:inherit}
.rk-top .fx::before{content:"";position:absolute;inset:-40% -10%;background:repeating-conic-gradient(from 2deg at 50% 50%,rgba(255,255,255,.75) 0 .6deg,transparent .6deg 4.2deg,rgba(255,255,255,.45) 4.2deg 4.8deg,transparent 4.8deg 9deg);-webkit-mask:radial-gradient(ellipse 50% 50% at 50% 50%,transparent 38%,rgba(0,0,0,.6) 62%,#000 95%);mask:radial-gradient(ellipse 50% 50% at 50% 50%,transparent 38%,rgba(0,0,0,.6) 62%,#000 95%);animation:rkSpin 1.1s ease-out both}
.rk-top b{font-family:var(--f-press);font-weight:400;font-size:24px;letter-spacing:-.01em;text-shadow:0 2px 0 rgba(0,50,120,.3);animation:rkBam .55s .25s cubic-bezier(.2,2,.4,1) both}
.rk-crown{font-family:var(--f-press);font-weight:400;font-size:24px;letter-spacing:-.01em;color:#fff;text-shadow:0 2px 0 rgba(0,50,120,.3);animation:rkBam .5s .1s cubic-bezier(.2,2,.4,1) both}
@keyframes rkPop{0%{transform:scale(.6);opacity:0}100%{transform:none;opacity:1}}
@keyframes rkBam{0%{transform:scale(2.2) rotate(-6deg);opacity:0}60%{opacity:1}100%{transform:scale(1);opacity:1}}
.rk-crown{--r:-8deg}
@keyframes rkSpin{from{transform:rotate(-40deg) scale(.7);opacity:0}to{transform:none;opacity:1}}
@keyframes rkRot{to{transform:rotate(360deg)}}
.rk-top .fx::before{animation:rkSpin 1.1s ease-out both,rkRot 14s linear 1.1s infinite!important}
.rk-top .fx::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-50%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);animation:rkShine 2.6s ease-in-out 1.2s infinite}
@keyframes rkShine{0%{left:-50%}60%,100%{left:120%}}
.qpill2{flex:1}
.rank .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.rank .hd b{font-size:20px;color:var(--b);font-weight:700}
.rank .hd span{font-size:15px;color:var(--sub2)}
.rank ol{list-style:none;display:grid;grid-template-columns:1fr 1fr;grid-auto-flow:column;grid-template-rows:repeat(5,auto);column-gap:20px;row-gap:12px}
.rank li{display:flex;gap:10px;align-items:center;height:26px;font-size:16px;color:var(--text);cursor:pointer}
.rank li i{font-style:normal;width:18px;color:var(--b)}
.rank li:nth-child(n+6) i{color:var(--sub)}
.rank li.hot{font-weight:600}
.rank li{opacity:0;animation:rkIn .45s ease forwards;animation-delay:var(--d)}
@keyframes rkIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.rank li .rk-k{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank li.hot i{color:#ff3d57;font-weight:800}
.rank li.rkfl .rk-k{animation:rkFlash 1.1s ease}
@keyframes rkFlash{0%{background:rgba(0,120,233,.18)}100%{background:transparent}}
.mv{font-style:normal;font-size:12px;font-weight:700;flex:none;letter-spacing:0}
.mv.up{color:#ff3d57}.mv.dn{color:#2f7cf6}.mv.eq{color:var(--mute)}
.mv.new{color:#fff;background:#ff3d57;border-radius:4px;padding:1px 4px;font-size:11px}
.rk-tick{position:relative;contain:paint;isolation:isolate;height:40px;overflow:hidden;border-radius:12px;background:var(--b-weak);margin:-4px 0 14px;cursor:pointer}
.rk-roll{position:absolute;left:0;right:0;top:0;transition:top .5s cubic-bezier(.3,.9,.3,1)}
.rk-row{height:40px;display:flex;align-items:center;gap:10px;padding:0 14px;font-size:17px}
.rk-row i{font-style:normal;font-weight:800;color:var(--b);width:20px}
.rk-row b{flex:1;font-weight:700}

/* 명소 카드 (Figma: 지금 뜨는 명소) */
.spotrow{display:flex;gap:12px;align-items:center;padding:13px;background:#fff;border:1px solid var(--line);border-radius:16px;cursor:pointer}
.spotrow+.spotrow{margin-top:8px}
.spotrow .ph{width:96px;height:96px;flex:none}
.spotrow .w{font-size:15px;color:var(--b-ink);line-height:16.5px}
.spotrow .n{font-size:17px;font-weight:700;color:var(--navy);margin-top:8px;line-height:20px}
.spotrow .j{font-size:17px;font-weight:500;color:var(--slate);line-height:20px}
.spotrow .s{font-size:15px;color:var(--mute);margin-top:6px}

/* ===== 만화책 느낌 (Figma 홈: 포스터 콜라주 + 집중선 말풍선 + 스크린톤) ===== */
.cart{position:relative;border-radius:15px;overflow:hidden;isolation:isolate;background:linear-gradient(170deg,var(--c1) 0%,var(--c2) 55%,var(--c3) 100%);color:#fff}
.cart::before{content:"";position:absolute;inset:0;z-index:0;background:radial-gradient(circle,rgba(255,255,255,.34) 1.15px,transparent 1.6px) 0 0/6px 6px;-webkit-mask:linear-gradient(160deg,#000 0%,transparent 65%);mask:linear-gradient(160deg,#000 0%,transparent 65%)}
.cart::after{content:"";position:absolute;inset:-50%;z-index:0;background:repeating-conic-gradient(from 0deg at 50% 45%,rgba(255,255,255,.2) 0 .55deg,transparent .55deg 5deg);-webkit-mask:radial-gradient(closest-side,transparent 42%,#000 95%);mask:radial-gradient(closest-side,transparent 42%,#000 95%)}
.cart .gr{position:absolute;left:0;right:0;bottom:0;height:24%;z-index:1;background:var(--c4,rgba(20,24,40,.55));clip-path:polygon(0 35%,18% 20%,32% 38%,55% 10%,70% 30%,85% 18%,100% 32%,100% 100%,0 100%)}
.cart .kj{position:absolute;left:12px;top:14px;z-index:2;writing-mode:vertical-rl;font-family:var(--f-press);font-weight:700;font-size:21px;line-height:1.05;letter-spacing:.04em;color:#fff;text-shadow:2px 2px 0 rgba(0,40,100,.45),-1px -1px 0 rgba(0,40,100,.25)}
.cart .sh{position:absolute;inset:0;z-index:2;background:linear-gradient(to top,rgba(0,0,0,.45),rgba(255,255,255,0) 45%)}
.cart .cap{position:absolute;left:12px;right:12px;bottom:11px;z-index:3}
.cart .cap .w{font-size:15px;opacity:.9}
.cart .cap .n{font-size:15px;font-weight:700;line-height:1.25;margin-top:1px}
.cart .bk{position:absolute;right:10px;top:10px;z-index:3;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.88);display:grid;place-items:center;color:var(--b)}
.cart .bk svg{width:20px;height:20px}
.cart .bk.on{background:var(--b);color:#fff}
.cart.sm .kj{font-size:15px;left:7px;top:8px}
.mason{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 8px}
.mason .col{display:flex;flex-direction:column;gap:6px;min-width:0}
.mason .cart{cursor:pointer}
.qb{position:relative;min-height:85px;margin:2px 0 8px;display:grid;place-items:center;text-align:center;font-size:18px;line-height:1.3;font-weight:600;padding:12px 14px;overflow:visible}
.qb .in{position:relative;z-index:1}
.qb .qs{display:block;font-size:15px;font-weight:500;opacity:.85;margin-top:4px}
.qb.tl::after,.qb.tr::after{content:"";position:absolute;bottom:-11px;width:24px;height:16px;background:#2a8cf1}
.qb.tl::after{left:20px;clip-path:polygon(0 0,100% 0,0 100%)}
.qb.tr::after{right:20px;clip-path:polygon(0 0,100% 0,100% 100%)}
.bubble{overflow:hidden}
.qb.bubble{overflow:visible}
.qb.bubble::before{inset:0;border-radius:15px;overflow:hidden;background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,255,255,.24) 0 .9deg,transparent .9deg 7deg);-webkit-mask:radial-gradient(farthest-side,transparent 62%,#000 100%);mask:radial-gradient(farthest-side,transparent 62%,#000 100%)}
.burst-h{display:flex;align-items:center;gap:8px;padding:0 16px;margin:26px 0 12px}
.burst-h h3{font-family:var(--f-press);font-weight:700;font-size:22px;color:var(--b);letter-spacing:-.01em}
.burst-h .fx{font-family:var(--f-press);font-weight:700;color:#fff;background:var(--b);font-size:15px;padding:3px 8px;border-radius:6px;transform:rotate(-6deg)}
.burst-h a{margin-left:auto;font-size:15px;color:var(--sub2);cursor:pointer}
.ph::before{background:radial-gradient(circle,rgba(0,120,233,.13) 1.1px,transparent 1.5px) 0 0/6px 6px}
.toast{background:var(--bubble)!important;font-weight:600}

/* ===== v3: 라운드 아이콘 · 여백 16px 통일 · 폰트 17/15 ===== */
body{font-size:17px;line-height:1.5}
.small{font-size:15px}
input,textarea{font-size:17px}
.pad{padding:0 16px}
.sec-h,.burst-h{padding:0 16px}
.chips,.hscroll{padding-left:16px;padding-right:16px}
.topbar{padding:8px 16px 8px}
.mason{padding:0 16px;gap:8px}.mason .col{gap:8px}
.cta{padding:12px 16px max(var(--sab),16px)}
.sheet{padding:10px 16px 30px}
.hdr{padding:0 8px}
.qpill .cat svg{width:18px;height:18px}
.qpill>svg{width:22px;height:22px}
.me svg{width:34px;height:34px}
.ib svg{width:24px;height:24px}
.tabbar svg{width:26px;height:26px}
.tabbar .scan span.c svg{width:28px;height:28px}
.tabbar button{gap:2px}
.tag{padding:4px 10px;border-radius:8px}
.chip{height:36px;padding:0 14px;border-radius:18px}
.btn.sm{height:42px}
.pin b{font-size:15px;padding:4px 9px;border-radius:10px}
.stamp{font-size:15px;line-height:1.2;word-break:keep-all}
.cart .cap .w{font-size:15px}.cart .cap .n{font-size:17px}
.qb{font-size:19px}.qb .qs{font-size:15px}
.spotrow .w,.spotrow .s{font-size:15px}
.rank .hd b{font-size:20px}
.ph.cart{display:block}
.ph.cart::before{background:radial-gradient(circle,rgba(255,255,255,.34) 1.15px,transparent 1.6px) 0 0/6px 6px}
.ph.cart .lb{position:absolute;left:8px;bottom:8px;margin:0;z-index:3}
.ph.cart .x{z-index:3;color:#fff;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.3)}
.cart .poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.cart.has-img::before,.cart.has-img::after,.cart.has-img .gr,.cart.has-img .kj{display:none}
.seg button{height:38px}

/* ===== v4: 타이틀 정돈 · 별 아이콘 · 플로팅 탭바 ===== */
.hdr .t.left{font-family:var(--f-body);font-weight:700;font-size:22px;color:var(--navy);letter-spacing:-.02em;margin-left:8px}
.hdr .t{font-weight:600;font-size:17px}
.burst-h h3,.sec-h h3,.sub-h,.near-h b,.rank .hd b{font-family:var(--f-press);font-weight:400;font-size:19px;color:var(--b);letter-spacing:-.01em}
.rank .hd b,.sub-h{font-size:19px!important}
.mv{font-size:11px!important}
/* 썸네일 별: 원 없이 별만, 크기 키움 */
.cart .bk{width:40px;height:40px;right:6px;top:6px;background:none;color:#fff;filter:drop-shadow(0 1px 3px rgba(0,30,70,.45))}
.cart .bk svg{width:28px;height:28px;stroke-width:2.2}
.cart .bk.on{background:none;color:#ffd84d}
.cart .bk.on svg path:first-child{fill:#ffd84d}
/* 하단 내비게이션: 텍스트 없음 · 둥근 플로팅 바 */
.tabbar{left:16px;right:16px;bottom:max(var(--sab),12px);height:64px;padding:0 6px;border:0;border-radius:32px;background:rgba(255,255,255,.96);box-shadow:0 12px 30px -12px rgba(0,60,130,.4),0 0 0 1px rgba(0,120,233,.07)}
.tabbar button{gap:0;color:#9db3cc}
.tabbar .ti{width:52px;height:42px;border-radius:21px;display:grid;place-items:center;transition:background .2s,color .2s,transform .2s}
.tabbar .ti svg{width:28px;height:28px;stroke-width:2.2}
.tabbar button.on{color:var(--b)}
.tabbar button.on .ti{background:var(--b-weak)}
.tabbar button:active .ti{transform:scale(.9)}
.tabbar .scan{margin-top:-22px}
.tabbar .scan span.c{width:60px;height:60px;border:4px solid #fff;box-shadow:0 10px 20px -8px rgba(0,120,233,.7)}
.tabbar .scan span.c svg{width:30px;height:30px;stroke-width:2.2}
.screen.has-tab .body{padding-bottom:calc(64px + max(var(--sab),12px) + 20px)}

/* ===== 홈 히어로: Figma '방문록 レビュー' 구성 ===== */
.hero{position:relative;display:grid;grid-template-columns:176px 1fr;height:176px;margin-top:8px}
.hero-pic{position:relative;cursor:pointer}
.hero-pic .cart{height:100%!important}
.hero-ret{position:absolute;inset:34px;z-index:4;pointer-events:none}
.hero-ret i{position:absolute;width:20px;height:20px;border:3px solid #fff;border-radius:3px;filter:drop-shadow(0 1px 2px rgba(0,30,70,.4));animation:rt 1.4s ease-in-out infinite}
.hero-ret i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0}.hero-ret i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0}
.hero-ret i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0}.hero-ret i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0}
.hero-tag{position:absolute;right:8px;top:8px;z-index:4;display:flex;align-items:center;gap:4px;font-size:15px;font-weight:700;color:#fff;background:rgba(0,40,90,.35);backdrop-filter:blur(4px);padding:3px 8px;border-radius:8px;letter-spacing:.02em}
.hero-tag svg{width:16px;height:16px}
.hero-t{padding:16px 0 0 20px;display:flex;flex-direction:column;line-height:1.05}
.hero-t b{font-family:var(--f-press);font-weight:700;font-size:30px;color:#0b2a4a;letter-spacing:-.02em;transform:skewX(-6deg);transform-origin:left}
.hero-t span{font-family:var(--f-press);font-weight:700;font-size:26px;color:#0b2a4a;letter-spacing:.08em;margin-top:6px}
.hero-b{position:absolute;right:0;bottom:0;width:calc(100% - 186px);height:84px;display:grid;place-items:center;text-align:center;font-size:17px;line-height:1.35;cursor:pointer;overflow:visible!important}
.hero-b::before{inset:0;border-radius:15px;background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,255,255,.26) 0 .9deg,transparent .9deg 7deg);-webkit-mask:radial-gradient(farthest-side,transparent 60%,#000 100%);mask:radial-gradient(farthest-side,transparent 60%,#000 100%)}
.hero-b::after{content:"";position:absolute;left:-16px;bottom:16px;width:26px;height:20px;background:#1b86ef;clip-path:polygon(100% 0,0 75%,100% 100%)}
.hero-cta{margin-top:14px;height:54px;font-size:17px;gap:8px}
.hero-cta svg{width:22px;height:22px}
.hero-cta .jp{font-weight:500;opacity:.85}
.hero-cta .go{display:inline-flex;margin-left:auto;padding-left:6px}
.hero-cta .go svg{width:18px;height:18px;transform:rotate(180deg)}
.hero-cta{justify-content:center;padding:0 18px;white-space:nowrap;position:relative}
.hero-cta .go{position:absolute;right:18px}
.hero-pic .kj{display:none}
.hero-ret{inset:38px 30px 30px}
.hero+.btn+.row .btn svg{width:18px;height:18px}

/* 원작 비교 슬라이더 */
.cmp{position:relative;height:300px;overflow:hidden;background:#111;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:ew-resize;--p:50%}
.cmp-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;pointer-events:none;-webkit-user-drag:none}
.cmp-top{position:absolute;inset:0;clip-path:inset(0 0 0 var(--p));-webkit-clip-path:inset(0 0 0 var(--p))}
.cmp-ph{position:absolute;inset:0;background:#2a3140;display:flex;align-items:center;justify-content:flex-end;padding-right:16px}
.cmp-ph span{display:inline-flex;align-items:center;gap:6px;font-size:15px;color:rgba(255,255,255,.75)}.cmp-ph svg{width:18px;height:18px}
.cmp-line{position:absolute;top:0;bottom:0;left:var(--p);width:2px;margin-left:-1px;background:#fff;box-shadow:0 0 6px rgba(0,0,0,.35);pointer-events:none}
.cmp-h{position:absolute;top:50%;left:var(--p);width:48px;height:48px;margin:-24px 0 0 -24px;padding:0;border-radius:50%;display:grid;place-items:center;color:#fff;
 background:rgba(255,255,255,.28);border:2px solid #fff;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 2px 10px rgba(0,0,0,.35);touch-action:none;cursor:ew-resize;transition:transform .15s}
.cmp.dragging .cmp-h{transform:scale(1.08)}
.cmp-tag{position:absolute;bottom:10px;font-size:15px;font-weight:600;color:#fff;background:rgba(0,0,0,.38);padding:3px 8px;border-radius:999px;pointer-events:none}
.cmp-tag.l{left:12px}.cmp-tag.r{right:12px}
/* 홈 포스터 스크롤 연동 */
.mason .cart .poster{transform:scale(1.14);transition:transform .45s cubic-bezier(.2,.8,.2,1);will-change:transform}

/* 성지 탐색 실제 지도 */
.near-h{display:flex;align-items:center;gap:6px;margin-bottom:10px;font-size:17px}.near-h svg{width:18px;height:18px;color:var(--b)}.near-h .muted{font-size:15px;margin-left:auto}
.body.xfade{opacity:.35}
.body{transition:opacity .18s ease}
.near{padding:0;overflow:hidden;position:relative;cursor:pointer}
.near-d{position:absolute;right:12px;top:12px;display:inline-flex;align-items:center;gap:3px;background:rgba(0,0,0,.55);color:#fff;font-size:15px;font-weight:600;padding:4px 10px;border-radius:999px}.near-d svg{width:15px;height:15px}
.spotrow .dist{color:var(--b);font-weight:700}
.evgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:4px}
.evw{display:block;height:260px;border-radius:14px;overflow:hidden;background:var(--line)}
.evw .evimg{height:100%;border-radius:0;transform:scale(1.18);transition:transform .45s cubic-bezier(.2,.8,.2,1);will-change:transform}
.ev{display:flex;flex-direction:column;gap:2px;color:inherit;text-decoration:none}
.evimg{width:100%;height:260px;object-fit:cover;border-radius:14px;display:block;background:var(--line)}.ev .ph .lb{display:none}.ev .ph .x{font-size:19px;font-weight:800;padding:0 12px;text-align:center;word-break:keep-all}
.ev b{font-size:15px;font-weight:700;margin-top:8px;line-height:1.3;word-break:keep-all}.ev span{font-size:15px;color:var(--mute)}
.av.me{background:var(--b)}
.rmap{height:360px;background:#e9eef2;touch-action:none;cursor:grab}
.rm-layer{position:absolute;inset:0;will-change:transform}
.rm-t{position:absolute;width:256px;height:256px;pointer-events:none;-webkit-user-drag:none;user-select:none}
.rmap .pin{z-index:2}.rmap .pin.cl b em{font-style:normal;opacity:.85}
.rm-zoom{position:absolute;right:12px;top:12px;z-index:3;display:flex;flex-direction:column;border-radius:12px;overflow:hidden;background:#fff;box-shadow:0 2px 8px rgba(0,60,130,.15)}
.rm-zoom button{width:38px;height:38px;font-size:22px;font-weight:600;color:var(--text);display:grid;place-items:center}
.rm-zoom button+button{border-top:1px solid var(--line)}
.rm-fit{position:absolute;right:12px;top:100px;z-index:3;width:38px;height:38px;border-radius:12px;background:#fff;display:grid;place-items:center;color:var(--b);box-shadow:0 2px 8px rgba(0,60,130,.15)}
.rm-fit svg{width:20px;height:20px}
.rm-attr{position:absolute;right:6px;bottom:32px;z-index:3;font-size:10px;color:#556;background:rgba(255,255,255,.75);padding:1px 5px;border-radius:4px}
.wchips .chip{display:inline-flex;align-items:center;gap:4px}.wchips .chip svg{width:16px;height:16px}
/* 나의 덕질 기록 */
.cntbox{display:flex;align-items:center;padding:16px 8px}
.cntbox button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.cntbox b{font-size:28px;font-weight:800;line-height:1.1;color:var(--text)}
.cntbox span{font-size:15px;font-weight:600;color:var(--mute)}
.cnt-div{width:1px;align-self:stretch;margin:4px 0;background:var(--line)}
.myar{margin:0 -16px}
.srch-in{cursor:text}.srch-in input{flex:1;border:0;outline:0;background:none;font:inherit;font-size:inherit;color:var(--b);min-width:0}.srch-in input::placeholder{color:var(--b);opacity:1}
.srch-chips{display:flex;flex-wrap:wrap;gap:8px}
.srch-none{display:flex;flex-direction:column;gap:4px;padding:18px 16px;margin:4px 0 20px;border-radius:14px;background:#eef4fb;text-align:center}.srch-none b{font-size:17px;word-break:keep-all}.srch-none span{font-size:15px;color:var(--mute)}
.sub-h{font-size:17px;font-weight:700;margin:0 0 12px}
.atabs{display:grid;grid-template-columns:1.3fr 1.1fr 1fr 1.1fr .8fr;padding:6px 4px;gap:2px}
.atabs button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px 10px;border-radius:12px;color:var(--mute);position:relative}
.atabs b{font-size:20px;font-weight:700;color:var(--text);line-height:1.1}
.atabs span{font-size:13px;font-weight:600;line-height:1.25;white-space:nowrap;letter-spacing:-.02em}
.atabs button.on{background:var(--accent-weak,#e8f2fe);color:var(--accent)}.atabs button.on b{color:var(--accent)}
.st-hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:18px 16px;cursor:pointer;background:#fffdf6}
.st3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 10px}
.st3c{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--mute);font-size:15px;line-height:1.3;text-align:center;word-break:keep-all}
.st3c svg{width:96px;height:96px}.st3c.got{color:var(--text);font-weight:600}
.ib.bkh.on{color:#f5b700}.ib.bkh.on svg path:first-child{fill:#ffd84d}

/* ===== 깜짝 미션 팝업 (스플래시 배경 그래픽 재사용) ===== */
.mission{position:absolute;inset:0;z-index:95;color:#fff;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;transition:opacity .22s ease}
.mission.on{opacity:1}.mission.off{opacity:0}
.ms-bg{position:absolute;inset:0;background:rgba(0,0,0,.72);overflow:hidden}
.ms-bg::before{content:"";position:absolute;inset:-60%;background:repeating-conic-gradient(from 3deg at 50% 50%,rgba(255,255,255,.28) 0 .7deg,transparent .7deg 6.5deg);-webkit-mask:radial-gradient(closest-side,transparent 34%,#000 80%);mask:radial-gradient(closest-side,transparent 34%,#000 80%);animation:spin 40s linear infinite}
.ms-bg::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 46%,rgba(255,255,255,.28),transparent 46%)}
.ms-x{position:absolute;top:54px;right:16px;z-index:3;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.8);color:#fff}
.ms-x svg{width:20px;height:20px}
.ms-body{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 24px;width:100%}
.mission.on .ms-body{animation:msPop .62s cubic-bezier(.2,1.6,.4,1) both}
@keyframes msPop{0%{transform:scale(.3) rotate(-8deg);opacity:0}60%{opacity:1}100%{transform:none;opacity:1}}
.ms-tag{font-size:15px;font-weight:600;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.8);padding:5px 12px;border-radius:999px;margin-bottom:14px}
.ms-t{font-family:var(--f-press,inherit);font-size:30px;font-weight:700;letter-spacing:-.01em;margin:0;text-shadow:0 3px 0 rgba(0,0,0,.35)}
.ms-s{font-size:17px;font-weight:500;margin:8px 0 0;opacity:.95}
.ms-stamp{position:relative;margin:30px 0 18px;width:220px;height:220px;display:grid;place-items:center;border-radius:50%;cursor:pointer;animation:msBob 1.6s ease-in-out .7s infinite}
@keyframes msBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.ms-ring{position:absolute;inset:0;border-radius:50%;border:2px dashed rgba(255,255,255,.85);animation:spin 14s linear infinite}
.ms-stamp::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:3px solid rgba(255,255,255,.6);animation:msPulse 1.6s ease-out infinite}
@keyframes msPulse{0%{transform:scale(.86);opacity:.9}100%{transform:scale(1.12);opacity:0}}
.ms-card{width:196px;height:196px;border-radius:50%;background:#fffdf6;display:grid;place-items:center;box-shadow:0 10px 0 rgba(0,40,110,.25),0 18px 40px rgba(0,30,90,.35)}
.ms-card.dim{opacity:.85}
.ms-stamp:active .ms-card{transform:scale(.94)}
.ms-tap{position:absolute;right:-6px;top:6px;background:#ffd34d;color:#1a2a55;font-weight:800;font-size:15px;padding:6px 11px;border-radius:999px;transform:rotate(12deg);box-shadow:0 4px 0 rgba(0,0,0,.18);animation:msWig 1.2s ease-in-out infinite}
@keyframes msWig{0%,100%{transform:rotate(12deg)}50%{transform:rotate(-4deg) scale(1.08)}}
.ms-hint{display:flex;align-items:center;gap:4px;font-size:15px;opacity:.9;margin:0}.ms-hint svg{width:16px;height:16px}
.badge-img{object-fit:contain;display:block;filter:drop-shadow(0 4px 8px rgba(0,0,0,.25))}
.badge-img.lk{filter:grayscale(1) brightness(1.15);opacity:.45}
.ms-card:has(.badge-img){background:transparent!important;box-shadow:none!important}
.st-hero .badge-img{margin:4px auto 0}
.stsvg.lk{filter:grayscale(1);opacity:.8}
.ms-load{position:relative;margin:34px 0 10px;width:220px;height:220px;display:grid;place-items:center}
.ms-spin{position:absolute;inset:0;border-radius:50%;border:4px solid rgba(255,255,255,.25);border-top-color:#fff;animation:spin .9s linear infinite}
.ms-done{position:relative;margin:30px 0 26px;width:220px;height:220px;display:grid;place-items:center}
.ms-done .ms-card{width:204px;height:204px}
.ms-card.slam{animation:msSlam .55s cubic-bezier(.3,1.5,.5,1) both}
@keyframes msSlam{0%{transform:scale(1.9) rotate(-18deg);opacity:0}55%{transform:scale(.92) rotate(3deg);opacity:1}100%{transform:none}}
.ms-conf{position:absolute;left:50%;top:50%;width:0;height:0}
.ms-conf i{position:absolute;width:9px;height:14px;border-radius:3px;background:var(--c);transform:rotate(var(--a)) translateY(0);opacity:0;animation:msBurst .9s ease-out var(--t) forwards}
@keyframes msBurst{0%{opacity:1;transform:rotate(var(--a)) translateY(0) scale(.6)}100%{opacity:0;transform:rotate(var(--a)) translateY(calc(-1*var(--d) - 60px)) scale(1)}}
.st-hero{position:relative;overflow:hidden;isolation:isolate;perspective:700px}
.sh-rays{position:absolute;inset:-60%;z-index:-1;background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(0,120,233,.10) 0 6deg,transparent 6deg 14deg);-webkit-mask:radial-gradient(closest-side,transparent 18%,#000 70%);mask:radial-gradient(closest-side,transparent 18%,#000 70%);animation:rkRot 22s linear infinite}
.sh-flip{position:relative;transform-style:preserve-3d;animation:shFlip 1.3s cubic-bezier(.25,.8,.3,1.15) both}
@keyframes shFlip{0%{transform:rotateX(-360deg) scale(.6);opacity:0}25%{opacity:1}100%{transform:rotateX(0) scale(1)}}
.sh-glint{position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.7) 50%,transparent 65%) -200% 0/250% 100% no-repeat;animation:shGlint 3.2s ease-in-out 1.4s infinite;border-radius:20px}
@keyframes shGlint{0%{background-position:-200% 0}50%,100%{background-position:200% 0}}
.sh-spark{position:absolute;left:50%;top:52%;width:8px;height:8px;margin:-4px;border-radius:50%;background:#ffd34d;opacity:0;animation:shSpark .8s ease-out var(--t) both}
.sh-spark:nth-child(even){background:#6baeff}
@keyframes shSpark{0%{opacity:1;transform:rotate(var(--a)) translateY(0) scale(.4)}100%{opacity:0;transform:rotate(var(--a)) translateY(-120px) scale(1)}}
.trip-del{width:34px;height:34px;flex:none;border-radius:50%;background:var(--b-weak);color:var(--b);font-size:22px;font-weight:700;line-height:1;display:grid;place-items:center}

/* ===== 네이티브 화면 전환 ===== */
#app{position:absolute;inset:0;overflow:hidden}
#app.navlock{pointer-events:none}
.screen{backface-visibility:hidden}
.enter-push{animation:navInR .38s cubic-bezier(.2,.8,.2,1) both;box-shadow:-10px 0 28px rgba(0,30,70,.16)}
.leave-push{animation:navOutL .38s cubic-bezier(.2,.8,.2,1) both}
.leave-push::after,.enter-pop::after{content:"";position:absolute;inset:0;background:rgba(10,20,40,.14);pointer-events:none;z-index:99}
.leave-push::after{animation:navDimIn .38s both}
.enter-pop{animation:navInL .33s cubic-bezier(.2,.8,.2,1) both}
.enter-pop::after{animation:navDimOut .33s both}
.leave-pop{animation:navOutR .33s cubic-bezier(.2,.8,.2,1) both;box-shadow:-10px 0 28px rgba(0,30,70,.16);z-index:2}
@keyframes navInR{from{transform:translate3d(100%,0,0)}to{transform:none}}
@keyframes navOutL{to{transform:translate3d(-30%,0,0)}}
@keyframes navInL{from{transform:translate3d(-30%,0,0)}to{transform:none}}
@keyframes navOutR{to{transform:translate3d(100%,0,0)}}
@keyframes navDimIn{from{opacity:0}to{opacity:1}}
@keyframes navDimOut{from{opacity:1}to{opacity:0}}
.screen.under{pointer-events:none;transform:translate3d(-30%,0,0)}
.screen.under .shade{position:absolute;inset:0;background:rgba(10,20,40,.14);z-index:99}
.screen.dragging{box-shadow:-10px 0 28px rgba(0,30,70,.18);will-change:transform}
#edge{position:absolute;left:0;top:var(--sat,0);bottom:0;width:20px;z-index:35;touch-action:none;display:none}
#edge.on{display:block}
@media (prefers-reduced-motion:reduce){.enter-push,.leave-push,.enter-pop,.leave-pop{animation-duration:.01s}}

.rvi-r{margin-left:auto;font-size:15px;font-weight:700;color:var(--b);background:var(--b-weak);padding:2px 8px;border-radius:8px;white-space:nowrap}
.rvi-t{margin:8px 0 8px;font-size:17px;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rvi-f{display:flex;align-items:center;justify-content:space-between;min-height:26px}
.rvi-tag{font-size:15px;font-weight:600;color:#fff;background:var(--b);padding:2px 10px;border-radius:12px}
.rvi-like{display:inline-flex;align-items:center;gap:4px;font-size:15px;color:var(--slate);padding:4px 2px}
.rvi-like svg{width:18px;height:18px}
.rvi-like.on{color:#e5484d}.rvi-like.on svg path:first-child{fill:#e5484d}
.rv-end{text-align:center;font-size:15px;color:var(--mute);padding:22px 0 30px}
.rvw-l{font-size:15px;font-weight:600;color:var(--navy);margin:12px 0 6px}
.rvw-stars{display:flex;align-items:center;gap:2px}
.rvw-stars button{font-size:32px;line-height:1;color:#d5dee8;padding:2px}
.rvw-stars button.on{color:var(--b)}
.rvw-sv{margin-left:8px;font-size:17px;font-weight:700;color:var(--b)}
.rvw-in{display:flex;align-items:center;gap:8px;height:50px;padding:0 14px;border:1.5px solid var(--b-light);border-radius:14px;background:#fff}
.rvw-in:focus-within{border-color:var(--b)}
.rvw-in input{flex:1;min-width:0;border:0;outline:0;font:inherit;font-size:17px;background:none;color:var(--navy)}
.rvw-in span{font-size:15px;color:var(--mute);flex:none}
.rvw-tags{display:flex;flex-wrap:wrap;gap:6px}
.btn:disabled{opacity:.45;pointer-events:none}

/* 스플래시 (Figma: 블루 + 집중선 + 로고) */
.splash{position:absolute;inset:0;z-index:100;background:#0078e9;display:grid;place-items:center;overflow:hidden;transition:opacity .45s ease,visibility 0s .45s}
.splash::before{content:"";position:absolute;inset:-60%;background:repeating-conic-gradient(from 3deg at 50% 50%,rgba(255,255,255,.28) 0 .7deg,transparent .7deg 6.5deg);-webkit-mask:radial-gradient(closest-side,transparent 34%,#000 80%);mask:radial-gradient(closest-side,transparent 34%,#000 80%);animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.splash .c{position:relative;text-align:center;color:#fff}
.splash .logo-img{width:240px;height:auto;display:block;margin:0 auto;filter:drop-shadow(0 4px 0 rgba(0,50,120,.3))}
.splash .sub{margin-top:10px;font-size:17px;font-weight:500;letter-spacing:.02em}
.splash.off{opacity:0;visibility:hidden}

 /* 말풍선: 왼쪽 열은 포스터 아래(꼬리 위로), 오른쪽 열은 포스터 위(꼬리 아래로) — qa로 바꿀 수 있어요 */
 const card=(it,h,col)=>{const pos=it.qa||(col?'above':'below'),b=it.q?qbub(spot(it.s),pos==='above'?'down':'up',pos==='above'?28:70,it.q):'';return pos==='above'?b+mcard(it,h):mcard(it,h)+b};

function homeParallax(sel='.mason .cart .poster'){const sc=curScreen(),body=sc&&sc.querySelector('.body');if(!body)return;
 /* 스크롤하는 동안 포스터가 따라 움직이고, 손을 떼고 스크롤이 멈추면 크게 튕기듯 원위치 */
 const imgs=()=>sc.querySelectorAll(sel);let base=null,touching=false,st=0;
 const move=()=>{if(base==null)base=body.scrollTop;const d=body.scrollTop-base,off=Math.max(-40,Math.min(40,-d*.22));imgs().forEach(i=>{i.style.transition='none';i.style.transform=`translate3d(0,${off.toFixed(1)}px,0) scale(1.18)`})};
 const home=()=>{base=null;imgs().forEach(i=>{i.style.transition='transform .9s cubic-bezier(.25,1.9,.45,1)';i.style.transform=''})};
 const settle=()=>{clearTimeout(st);st=setTimeout(()=>{if(!touching)home()},140)};
 body.addEventListener('touchstart',()=>{touching=true;base=body.scrollTop},{passive:true});
 const end=()=>{touching=false;settle()};body.addEventListener('touchend',end,{passive:true});body.addEventListener('touchcancel',end,{passive:true});
 body.addEventListener('scroll',()=>{move();settle()},{passive:true})}

const HOTKW=[{k:'주술회전',m:2},{k:'너의 이름은',m:0},{k:'체인소맨',m:'new'},{k:'슬램덩크',m:-2},{k:'봇치 더 록',m:3},{k:'최애의 아이',m:-1},{k:'하이큐',m:1},{k:'푸른 상자',m:'new'},{k:'케이온',m:-3},{k:'명탐정 코난',m:0}];

const CMP_ARR='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7l-5 5 5 5M15 7l5 5-5 5"/></svg>';
function cmpSlider(sp){const p=(S.cmpPos&&S.cmpPos[sp.id]!=null)?S.cmpPos[sp.id]:50;
 const orig=`assets/${HERO_SCENE.has(sp.id)?'hero':'posters'}/${sp.id}.jpg?v=${ASSET_V}`;
 return`<div class="cmp" style="--p:${p}%">

  <span class="cmp-tag l">원작</span><span class="cmp-tag r">실제</span>
 </div>`}
function initCmp(id){const el=curScreen().querySelector('.cmp');if(!el)return;const h=el.querySelector('.cmp-h');S.cmpPos=S.cmpPos||{};
 let pos=S.cmpPos[id]!=null?S.cmpPos[id]:50,raf=0,drag=null;
 const set=v=>{pos=Math.max(0,Math.min(100,v));el.style.setProperty('--p',pos+'%');h.setAttribute('aria-valuenow',Math.round(pos))};
 const at=x=>{const r=el.getBoundingClientRect();return (x-r.left)/r.width*100};
 const stopHint=()=>{if(raf){cancelAnimationFrame(raf);raf=0}};
 const finish=()=>{drag=null;el.classList.remove('dragging');S.cmpPos[id]=pos};
 el.addEventListener('pointerdown',e=>{if(e.button>0)return;stopHint();
  drag={id:e.pointerId,x:e.clientX,y:e.clientY,on:!!e.target.closest('.cmp-h')||e.pointerType==='mouse'};
  try{el.setPointerCapture(e.pointerId)}catch(_){}
  if(drag.on){el.classList.add('dragging');set(at(e.clientX))}});
 el.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;
  if(!drag.on){const dx=Math.abs(e.clientX-drag.x),dy=Math.abs(e.clientY-drag.y);if(dx>6&&dx>dy){drag.on=true;el.classList.add('dragging')}else return}
  e.preventDefault();set(at(e.clientX))});
 el.addEventListener('pointerup',e=>{if(!drag||e.pointerId!==drag.id)return;if(!drag.on)set(at(e.clientX));finish()});
 el.addEventListener('pointercancel',e=>{if(drag&&e.pointerId===drag.id)finish()});
 el.addEventListener('lostpointercapture',e=>{if(drag&&e.pointerId===drag.id)finish()});
 h.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();stopHint();set(pos+(e.key==='ArrowLeft'?-5:5));S.cmpPos[id]=pos}});
 set(pos);
 /* 첫 진입 시에만 좌우 안내 애니메이션 — 직접 만지면 즉시 종료 */
 if(!S._cmpHinted){S._cmpHinted=true;const t0=performance.now()+450,D=1700;
  const tick=t=>{const k=(t-t0)/D;if(k<0){raf=requestAnimationFrame(tick);return}if(k>=1){set(50);raf=0;return}
   set(50+Math.sin(k*Math.PI*4)*9*(1-k));raf=requestAnimationFrame(tick)};raf=requestAnimationFrame(tick)}}

function planRoute(sp){
 const o=planFrom(sp),reg=REGION_OF(sp),krw=reg==='seoul',d=(PROUTE[sp.id]||{})[o.id]||{t:[],walk:10,fare:0,km:5};
 const mode=S.planMode,dest={name:sp.name,kind:'dest'};
 if(mode==='transit'){
  const nodes=[{name:o.name,kind:'origin'}];let total=0;
  d.t.forEach(([line,min,to],i)=>{nodes.push({name:to,kind:i<d.t.length-1?'transfer':'stop',seg:{label:line,min,type:'ride'}});total+=min});
  total+=d.walk+Math.max(0,d.t.length-1)*4;          // 환승 대기 4분씩
  dest.seg={label:'도보',min:d.walk,type:'walk'};nodes.push(dest);
  return{total,cost:money(d.fare,krw),costNote:d.t.length?'편도 · IC카드 기준':'',transfers:Math.max(0,d.t.length-1),km:d.km,nodes,
   summary:d.t.length?`${d.t.length===1?'환승 없음':'환승 '+(d.t.length-1)+'회'}`:'도보만으로 이동',warn:''};
 }
 if(mode==='walk'){
  const km=Math.max(d.km,.2),total=km*13;
  const nodes=[{name:o.name,kind:'origin'},{...dest,seg:{label:'도보',min:total,type:'walk',dist:km}}];
  return{total,cost:'무료',costNote:'',transfers:0,km,nodes,summary:`${km<1?Math.round(km*1000)+'m':km.toFixed(1)+'km'} 걷기`,
   warn:km>25?'도보로는 이동하기 어려운 거리예요. 대중교통이나 자동차를 추천해요.':km>4?'도보로는 꽤 먼 거리예요. 대중교통을 함께 고려해 보세요.':''};
 }
 const km=Math.max(d.km,.2),drive=km<=15?km*3.2+5:km*1.05+12,park=3,via=CAR_VIA[reg](km);
 const taxi=km<=30,cost=krw?(taxi?4800+Math.round(km*1100/100)*100:Math.round(km*180/100)*100+6000):(taxi?500+Math.round(km*430/10)*10:Math.round(km*55/10)*10+Math.round(km*24/10)*10);
 const nodes=[{name:o.name,kind:'origin'},{name:via.replace(' 경유',''),kind:'stop',seg:{label:'자동차',min:drive*.75,type:'drive'}},{name:'목적지 인근 주차장',kind:'stop',seg:{label:'자동차',min:drive*.25,type:'drive'}},{...dest,seg:{label:'도보',min:park,type:'walk'}}];
 return{total:drive+park,cost:money(cost,krw),costNote:taxi?'택시 기준':'유류비·통행료 기준',transfers:0,km,nodes,summary:`약 ${km<1?km.toFixed(1):Math.round(km)}km 주행`,warn:''};
}

/* ================= 애니 화풍 실시간 셰이더 (WebGL) ================= */
/* 셀 셰이딩 + 외곽선 + 작품별 팔레트 색보정 + 애니 하늘 교체를 매 프레임 적용 */
const PAL_BG=['#2f74c0','#a6d8f0','#2e5a6b','#fff3df','#2b2a25']; // 레퍼런스(애니 배경 미술) 분석 팔레트: 하늘 위, 하늘 아래, 그림자 틴트, 하이라이트, 선
const PAL={natsu:PAL_BG,nami:PAL_BG,hoshi:PAL_BG,neko:PAL_BG,yuki:PAL_BG};
const hex3=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)/255);
const FX={ok:null};
const VS=`attribute vec2 p;varying vec2 v;void main(){v=(p+1.)*.5;gl_Position=vec4(p,0.,1.);}`;
const FS=`#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform sampler2D uTex;uniform vec2 uRes,uTexRes;uniform float uTime,uToon,uEdge,uSky,uGrade;
uniform vec3 uSkyTop,uSkyBot,uShadow,uHigh,uInk;varying vec2 v;
float lu(vec3 c){return dot(c,vec3(.299,.587,.114));}
float h21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float nz(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h21(i),h21(i+vec2(1,0)),f.x),mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float s=0.,a=.5;for(int i=0;i<5;i++){s+=a*nz(p);p*=2.03;a*=.5;}return s;}
float skyLike(vec3 c){float mx=max(c.r,max(c.g,c.b)),mn=min(c.r,min(c.g,c.b));float sat=(mx-mn)/(mx+.001);
 return smoothstep(.05,.12,c.b-c.r)*smoothstep(-.06,0.,c.b-c.g)*smoothstep(.38,.55,lu(c))*smoothstep(.1,.2,sat);}
void main(){
 float ra=uRes.x/uRes.y,ta=uTexRes.x/uTexRes.y;vec2 sc=vec2(1.);if(ra>ta)sc.y=ta/ra;else sc.x=ra/ta;
 vec2 uv=(vec2(v.x,1.-v.y)-.5)*sc+.5;
 vec2 px=sc*1.6/uRes;
 vec3 c=texture2D(uTex,uv).rgb;float lc=lu(c);
 /* 회화적 평면 채색: 두 겹 링에서 밝기가 비슷한 이웃만 평균 (붓으로 칠한 면처럼 결을 지움) */
 vec3 sm=c;float ws=1.;
 for(int k=0;k<8;k++){float an=float(k)*.785398;vec2 d=vec2(cos(an),sin(an));
  vec3 n1=texture2D(uTex,uv+d*px*2.).rgb;float w1=1.-smoothstep(0.,.1,abs(lu(n1)-lc));sm+=n1*w1;ws+=w1;
  vec3 n2=texture2D(uTex,uv+d*px*4.5).rgb;float w2=(1.-smoothstep(0.,.08,abs(lu(n2)-lc)))*.7;sm+=n2*w2;ws+=w2;}
 sm/=ws;
 /* 윤곽: 강한 경계만, 얇고 연한 색선 */
 float tl=lu(texture2D(uTex,uv+px*vec2(-1,-1)).rgb),t=lu(texture2D(uTex,uv+px*vec2(0,-1)).rgb),tr=lu(texture2D(uTex,uv+px*vec2(1,-1)).rgb);
 float l=lu(texture2D(uTex,uv+px*vec2(-1,0)).rgb),r=lu(texture2D(uTex,uv+px*vec2(1,0)).rgb);
 float bl=lu(texture2D(uTex,uv+px*vec2(-1,1)).rgb),b=lu(texture2D(uTex,uv+px*vec2(0,1)).rgb),br=lu(texture2D(uTex,uv+px*vec2(1,1)).rgb);
 float gx=-tl-2.*l-bl+tr+2.*r+br,gy=-tl-2.*t-tr+bl+2.*b+br;
 float edge=smoothstep(.32,.6,length(vec2(gx,gy)));
 vec3 col=sm;
 /* 부드러운 셀 명암: 5단계, 경계는 살짝 풀어서 */
 if(uToon>.5){float L=lu(col);float f=L*5.;float q=(floor(f)+smoothstep(.3,.7,fract(f)))/5.;q=max(q,.06);col=col*(q/max(L,.03));col=clamp(col,0.,1.);}
 /* 배경 미술 색보정: 차가운 청록 그림자 + 따뜻한 크림 하이라이트 + S커브 + 채도 */
 if(uGrade>.5){float L=lu(col);
  col=mix(col,col*uShadow*2.6+uShadow*.08,(1.-smoothstep(0.,.5,L))*.5);
  col=mix(col,col*uHigh*1.04+.02,smoothstep(.5,1.,L)*.55);
  col=mix(col,col*col*(3.-2.*col),.45);
  col=clamp(mix(vec3(lu(col)),col,1.28),0.,1.);
  /* 빛 번짐 */
  float g=0.;for(int k=0;k<8;k++){float an=float(k)*.785398+.39;vec3 n=texture2D(uTex,uv+vec2(cos(an),sin(an))*px*7.).rgb;g+=smoothstep(.72,.95,lu(n));}
  col+=uHigh*(g/8.)*.22;}
 /* 하늘 교체: 짙은 파랑→밝은 하늘색 그라데이션 + 입체 뭉게구름 */
 if(uSky>.5){float yt=1.-v.y;
  /* 하늘 판정: 뚜렷하게 푸르고 밝고 매끈한 픽셀 + 화면 위쪽 끝까지 같은 열이 계속 하늘이어야 함 */
  float m=skyLike(c)*(1.-edge)*(1.-smoothstep(.45,.7,yt));
  for(int k=1;k<5;k++){float f=float(k)/5.;vec2 up=vec2(uv.x,mix(uv.y,(.5-.5*sc.y)+.002,f));m*=mix(.15,1.,skyLike(texture2D(uTex,up).rgb));}
  m=smoothstep(.3,.7,m);
  vec3 sky=mix(uSkyTop,uSkyBot,pow(clamp(yt/.62,0.,1.),.8));
  vec2 cp=vec2(v.x*1.7+uTime*.008,yt*3.2);
  float dn=fbm(cp)+(.35-yt)*.25;float dn2=fbm(cp+vec2(.02,-.07))+(.35-yt+.07*.3)*.25;
  float cm=smoothstep(.5,.535,dn);
  float lit=clamp((dn-dn2)*7.+.55,0.,1.);
  vec3 cloud=mix(vec3(.64,.73,.84),vec3(1.,.995,.98),lit);
  cloud=mix(cloud,uSkyBot,smoothstep(.535,.5,dn)*.3);
  sky=mix(sky,cloud,cm);
  col=mix(col,sky,m);}
 if(uEdge>.5)col=mix(col,uInk,edge*.38);
 gl_FragColor=vec4(col,1.);
}`;
function fxInit(cv){
 if(FX.ok===false)return false;
 if(FX.cv===cv&&FX.ok)return true;
 const gl=cv.getContext('webgl',{preserveDrawingBuffer:true,premultipliedAlpha:false})||cv.getContext('experimental-webgl',{preserveDrawingBuffer:true});
 if(!gl){FX.ok=false;return false}
 const sh=(t,s)=>{const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(o));return o};
 try{
  const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,VS));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(pr);
  if(!gl.getProgramParameter(pr,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(pr));
  gl.useProgram(pr);
  const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  const loc=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  const tex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tex);
  [gl.TEXTURE_WRAP_S,gl.TEXTURE_WRAP_T].forEach(k=>gl.texParameteri(gl.TEXTURE_2D,k,gl.CLAMP_TO_EDGE));
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  const U={};['uTex','uRes','uTexRes','uTime','uToon','uEdge','uSky','uGrade','uSkyTop','uSkyBot','uShadow','uHigh','uInk'].forEach(n=>U[n]=gl.getUniformLocation(pr,n));
  Object.assign(FX,{ok:true,cv,gl,pr,U,tex});return true;
 }catch(e){console.warn('FX',e);FX.ok=false;return false}
}
/* 시뮬레이션용 거리 사진 (카메라가 없을 때 셰이더 데모용) */

 onnazaka:[35.7066,139.7520],kamakura_sd:[35.3069,139.5005],sunshine:[35.7289,139.7197],kifune_cn:[34.6654,135.4323],keion:[35.2054,136.2311],
 seihantai:[34.6857,135.8399],nagatoro:[35.7006,139.5439],gotoubun:[35.0167,135.7096],yanineko:[34.9858,135.7588],tamako:[35.0306,135.7703]};
const regList=c=>{const l=SPOTS.filter(s=>REG.includes(s.id));return c==='all'?l:c==='hot'?l.sort((a,b)=>b.visits-a.visits).slice(0,6):l.filter(s=>s.cat===c).sort((a,b)=>b.visits-a.visits)};
/* 현재 위치(예시): 도쿄 탭·전체 = 하라주쿠역, 오사카 탭 = 시조역(교토) — 실제 GPS는 사용하지 않아요 */
const HERE={all:{name:'하라주쿠역',g:[35.6702,139.7027]},tokyo:{name:'스이도바시역',g:[35.7020,139.7536]},osaka:{name:'교토역 하치조 출구',g:[34.9846,135.7590]}};
const km=(a,b)=>{const R=6371,t=x=>x*Math.PI/180,d1=t(b[0]-a[0]),d2=t(b[1]-a[1]),h=Math.sin(d1/2)**2+Math.cos(t(a[0]))*Math.cos(t(b[0]))*Math.sin(d2/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
const fmtKm=d=>d<1?Math.round(d*1000)+'m':d<10?d.toFixed(1)+'km':Math.round(d)+'km';

function exploreChips(){const sc=curScreen(),b=sc&&sc.querySelector('.body'),ch=sc&&sc.querySelector('.echips');if(!b||!ch)return;const H=ch.offsetHeight+12;
 const h0=ch.offsetHeight;ch.style.overflowY='hidden';const f=()=>{const y=Math.min(H,Math.max(0,b.scrollTop));ch.style.height=Math.max(0,h0-y)+'px';ch.style.marginBottom=Math.max(0,12-Math.max(0,y-h0))+'px';ch.style.opacity=(1-y/H).toFixed(2)};b.addEventListener('scroll',f,{passive:true});f()}

 const list=regList(c).map(s=>({s,d:km(h.g,GEO[s.id])})).sort((a,b)=>a.d-b.d);const near=list[0],rest=list.slice(1);

    ${art(near.s,210,{cap:false,bk:false,img:img(near.s),st:'border-radius:16px 16px 0 0;'})}
    <span class="near-d">${I.pin}${fmtKm(near.d)}</span>
    <div style="padding:12px 14px 14px"><div class="small" style="color:var(--b);font-weight:600">${work(near.s).title}</div><div style="font-size:19px;font-weight:700;margin-top:2px">${near.s.name}</div><div class="small muted">${near.s.jp} · ${near.s.st}</div></div>
   </div></div>`:''}
  <div class="sec-h" style="margin-top:22px"><h3>${c==='all'?'전체':catName(c)} ${list.length}곳</h3><a>가까운 순</a></div>
  <div style="padding:0 16px 20px">${rest.map(({s,d})=>spotRow(s,img(s)).replace('<div class="s">',`<div class="s"><b class="dist">${fmtKm(d)}</b> · `)).join('')}</div>

  ${list.map(e=>`<div class="opt" style="cursor:pointer" data-sx="t" data-id="${e.id}">${thumb?`<img class="expth" src="assets/exp/${e.id}.jpg?v=${ASSET_V}" alt="" loading="lazy">`:ph('',56,'width:56px;flex:none')}<div style="flex:1"><div class="row" style="gap:6px"><b>${e.name}</b>${e.rec?'<span class="tag ac">추천</span>':''}</div><div class="small muted">${e.desc}</div></div><span class="tg ${st[e.id]?'on':''}"></span></div>`).join('')}

 draw();
 el.onclick=e=>{const t=e.target.closest('[data-sx]');if(!t)return;const a=t.dataset.sx;

 document.getElementById('dim').classList.add('on');el.classList.add('on');
